<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Juego interactivo para practicar y dominar el cálculo de límites y continuidad de 2º de Bachillerato.">
<title>Límites — Juego de cálculo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#8734;</text></svg>">
<style>
/* =========================================================================
 * styles.css — Interfaz del juego de límites (2º de Bachillerato)
 * -------------------------------------------------------------------------
 * Tema oscuro, mobile-first, sin dependencias.
 * Todas las variables del contrato §10 están definidas aquí.
 * ========================================================================= */

/* =========================================================================
 * 1. Tokens
 * ========================================================================= */

:root {
  color-scheme: dark;

  /* --- Superficies --- */
  --bg: #0a0e16;
  --bg-elev: #111826;
  --bg-elev-2: #18212f;
  --bg-sunken: #070a10;

  /* --- Texto --- */
  --fg: #e9eff8;
  --fg-dim: #a3b4ca;
  --fg-faint: #6d8098;

  /* --- Acento --- */
  --accent: #6aa9ff;
  --accent-2: #a78bfa;
  --ok: #3ddc97;
  --warn: #ffb454;
  --err: #ff6b7f;

  /* --- Variantes suaves (fondos de chips y estados) --- */
  --ok-soft: rgba(61, 220, 151, 0.14);
  --err-soft: rgba(255, 107, 127, 0.14);
  --warn-soft: rgba(255, 180, 84, 0.14);
  --accent-soft: rgba(106, 169, 255, 0.14);
  --accent-2-soft: rgba(167, 139, 250, 0.14);

  /* --- Bordes --- */
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.17);

  /* --- Colores por tópico (CONTRATO §7) --- */
  --c-sustitucion: #5ac8fa;
  --c-infinito: #a78bfa;
  --c-indet: #ffb454;
  --c-continuidad: #3ddc97;

  /* --- Radios --- */
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-full: 999px;

  /* --- Sombras --- */
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35), 0 4px 14px rgba(0, 0, 0, 0.22);
  --shadow-2: 0 2px 6px rgba(0, 0, 0, 0.4), 0 18px 44px rgba(0, 0, 0, 0.42);

  /* --- Tipografías --- */
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --font-math: "Cambria Math", "Latin Modern Math", "STIX Two Math", "TeX Gyre Termes Math",
    "DejaVu Math TeX Gyre", "XITS Math", Cambria, Georgia, "Times New Roman", serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
    "Liberation Mono", "Courier New", monospace;

  /* --- Ritmo --- */
  --gap: 12px;
  --pad: 16px;
  --maxw: 760px;
  --t-fast: 150ms;
  --t: 200ms;
  --t-slow: 250ms;
  --ease: cubic-bezier(0.2, 0.7, 0.3, 1);
}

/* =========================================================================
 * 2. Reset
 * ========================================================================= */

*,
*::before,
*::after { box-sizing: border-box; }

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  overflow-x: hidden;
}

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
  color: var(--fg);
  background-color: var(--bg);
  /* Degradado muy sutil: dos focos suaves sobre el fondo base. */
  background-image:
    radial-gradient(1100px 620px at 12% -10%, rgba(106, 169, 255, 0.11), transparent 62%),
    radial-gradient(900px 560px at 108% 4%, rgba(167, 139, 250, 0.10), transparent 60%),
    radial-gradient(800px 520px at 50% 112%, rgba(61, 220, 151, 0.06), transparent 64%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4, p, ol, ul, figure, blockquote {
  margin: 0;
  padding: 0;
}

ol, ul { list-style: none; }

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

button { cursor: pointer; }

button:disabled { cursor: not-allowed; }

a { color: var(--accent); }

::selection { background: rgba(106, 169, 255, 0.32); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

/* =========================================================================
 * 3. Utilidades de composición
 * ========================================================================= */

.app {
  width: 100%;
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 var(--pad) calc(40px + env(safe-area-inset-bottom, 0px));
}

.row {
  display: flex;
  align-items: center;
  gap: var(--gap);
}

.row-wrap { flex-wrap: wrap; }

.row-top { align-items: flex-start; }

.grow { flex: 1 1 auto; min-width: 0; }

.spacer { flex: 1 1 auto; }

.muted { color: var(--fg-dim); }

.faint { color: var(--fg-faint); }

.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.small { font-size: 0.86rem; }

.tiny { font-size: 0.78rem; }

.center { text-align: center; }

.right { text-align: right; }

.divider {
  height: 1px;
  background: var(--border);
  border: 0;
  margin: 14px 0;
}

.visually-hidden {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.stack > * + * { margin-top: 12px; }

/* =========================================================================
 * 4. Cabecera
 * ========================================================================= */

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 56px;
  padding: 10px 0;
  margin-bottom: 14px;
  background: linear-gradient(to bottom, rgba(10, 14, 22, 0.94), rgba(10, 14, 22, 0.78));
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

.topbar .brand {
  font-weight: 700;
  letter-spacing: -0.01em;
  font-size: 1.02rem;
  display: flex;
  align-items: center;
  gap: 8px;
}

.topbar .brand-mark {
  font-family: var(--font-math);
  font-size: 1.35rem;
  color: var(--accent);
  line-height: 1;
}

.topbar-stats {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}

.stat {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: var(--r-full);
  background: var(--bg-elev-2);
  border: 1px solid var(--border);
  font-size: 0.84rem;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.stat .stat-ico { font-size: 0.95rem; line-height: 1; }

.stat-xp { color: var(--accent); }
.stat-streak { color: var(--warn); }
.stat-streak.cold { color: var(--fg-faint); }

/* =========================================================================
 * 5. Pantallas y tarjetas
 * ========================================================================= */

.screen {
  display: block;
}

/* Sólo al cambiar de pantalla: el resto de renders no parpadean */
.screen-enter { animation: fadeUp var(--t) var(--ease); }

.screen-head {
  margin-bottom: 16px;
}

.screen-title {
  font-size: 1.45rem;
  font-weight: 750;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

.screen-sub {
  margin-top: 4px;
  color: var(--fg-dim);
  font-size: 0.93rem;
}

.card {
  background: linear-gradient(180deg, var(--bg-elev) 0%, rgba(17, 24, 38, 0.92) 100%);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-1);
  padding: var(--pad);
}

.card + .card { margin-top: 12px; }

.card-tight { padding: 12px; }

.card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

/* =========================================================================
 * 6. Botones
 * ========================================================================= */

.btn {
  --btn-bg: var(--bg-elev-2);
  --btn-fg: var(--fg);
  --btn-bd: var(--border-strong);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 42px;
  padding: 9px 16px;
  border-radius: var(--r-md);
  border: 1px solid var(--btn-bd);
  background: var(--btn-bg);
  color: var(--btn-fg);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.2;
  text-align: center;
  transition: background var(--t) var(--ease), border-color var(--t) var(--ease),
    transform var(--t-fast) var(--ease), opacity var(--t) var(--ease);
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.btn:hover:not(:disabled) {
  background: color-mix(in srgb, var(--btn-bg) 70%, #ffffff 8%);
  border-color: var(--border-strong);
}

.btn:active:not(:disabled) { transform: translateY(1px) scale(0.995); }

.btn:disabled {
  opacity: 0.42;
  transform: none;
}

.btn-primary {
  --btn-bg: linear-gradient(180deg, #7cb6ff, #4d8ff0);
  --btn-fg: #06101f;
  --btn-bd: transparent;
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.25) inset, 0 6px 18px rgba(77, 143, 240, 0.28);
}

.btn-primary:hover:not(:disabled) {
  background: linear-gradient(180deg, #8ec1ff, #5a99f5);
}

.btn-ghost {
  --btn-bg: transparent;
  --btn-fg: var(--fg-dim);
  --btn-bd: var(--border);
}

.btn-ghost:hover:not(:disabled) {
  --btn-fg: var(--fg);
  --btn-bd: var(--border-strong);
  background: rgba(255, 255, 255, 0.04);
}

.btn-danger {
  --btn-bg: transparent;
  --btn-fg: var(--err);
  --btn-bd: rgba(255, 107, 127, 0.4);
}

.btn-danger:hover:not(:disabled) {
  --btn-bg: var(--err-soft);
  --btn-bd: var(--err);
}

.btn-ok {
  --btn-bg: linear-gradient(180deg, #4ee6a6, #27c184);
  --btn-fg: #04160e;
  --btn-bd: transparent;
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.25) inset, 0 6px 18px rgba(39, 193, 132, 0.26);
}

.btn-sm {
  min-height: 34px;
  padding: 5px 12px;
  font-size: 0.84rem;
  border-radius: var(--r-sm);
}

.btn-block { width: 100%; }

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.btn-row > .btn { flex: 1 1 132px; }

.icon-btn {
  width: 42px;
  min-height: 42px;
  padding: 0;
  flex: 0 0 auto;
}

.kbd {
  display: inline-block;
  min-width: 18px;
  padding: 1px 5px;
  border-radius: 5px;
  border: 1px solid var(--border-strong);
  background: var(--bg-elev-2);
  font-family: var(--font-mono);
  font-size: 0.7rem;
  line-height: 1.5;
  color: var(--fg-faint);
  text-align: center;
}

/* =========================================================================
 * 7. Chips
 * ========================================================================= */

.chip {
  --chip-c: var(--fg-dim);
  --chip-bg: rgba(255, 255, 255, 0.045);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: var(--r-full);
  border: 1px solid color-mix(in srgb, var(--chip-c) 35%, transparent);
  background: color-mix(in srgb, var(--chip-c) 12%, transparent);
  color: var(--chip-c);
  font-size: 0.78rem;
  font-weight: 600;
  line-height: 1.5;
  white-space: nowrap;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chip-ok { --chip-c: var(--ok); }
.chip-err { --chip-c: var(--err); }
.chip-warn { --chip-c: var(--warn); }
.chip-accent { --chip-c: var(--accent); }
.chip-accent2 { --chip-c: var(--accent-2); }
.chip-mute { --chip-c: var(--fg-faint); }

.chip-solid {
  background: var(--chip-c);
  color: #06101f;
  border-color: transparent;
}

.chip-lvl { --chip-c: var(--accent); }
.chip-modo { --chip-c: var(--accent-2); }
.chip-facil { --chip-c: var(--ok); }
.chip-media { --chip-c: var(--warn); }
.chip-dificil { --chip-c: var(--err); }

/* Chips por tópico: el color lo fija app.js con la variable del contrato. */
.chip-topic[data-topic="sustitucion"] { --chip-c: var(--c-sustitucion); }
.chip-topic[data-topic="infinito"] { --chip-c: var(--c-infinito); }
.chip-topic[data-topic="indeterminacion"] { --chip-c: var(--c-indet); }
.chip-topic[data-topic="continuidad"] { --chip-c: var(--c-continuidad); }

/* Puntos de dificultad ●●○○○ */
.diff-dots {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 1px;
  color: var(--chip-c, var(--warn));
}

.diff-dots .off { opacity: 0.28; }

/* =========================================================================
 * 8. Portada
 * ========================================================================= */

.hero {
  padding: 26px 20px 24px;
  border-radius: var(--r-lg);
  border: 1px solid var(--border);
  background:
    radial-gradient(560px 260px at 18% 0%, rgba(106, 169, 255, 0.14), transparent 70%),
    linear-gradient(180deg, var(--bg-elev), rgba(17, 24, 38, 0.9));
  box-shadow: var(--shadow-2);
  text-align: center;
  margin-bottom: 16px;
}

.hero-mark {
  font-family: var(--font-math);
  font-size: 3.4rem;
  line-height: 1;
  color: var(--accent);
  margin-bottom: 6px;
  filter: drop-shadow(0 4px 16px rgba(106, 169, 255, 0.35));
}

.hero-title {
  font-size: clamp(1.7rem, 7vw, 2.35rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.1;
}

.hero-sub {
  margin: 10px auto 0;
  max-width: 44ch;
  color: var(--fg-dim);
  font-size: 0.98rem;
}

.hero-actions {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-top: 22px;
}

.hero-actions .btn { min-height: 50px; font-size: 1rem; }

.hero-foot {
  margin-top: 18px;
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}

.stat-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
  gap: 8px;
  margin-bottom: 16px;
}

.stat-cell {
  text-align: center;
  padding: 10px 6px;
  border-radius: var(--r-md);
  background: var(--bg-elev);
  border: 1px solid var(--border);
}

.stat-cell b {
  display: block;
  font-size: 1.2rem;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

.stat-cell span {
  font-size: 0.74rem;
  color: var(--fg-faint);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* =========================================================================
 * 9. Campaña: rejilla de niveles
 * ========================================================================= */

.levels {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
}

.level {
  position: relative;
  display: block;
  width: 100%;
  text-align: left;
  padding: 13px 14px;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: linear-gradient(180deg, var(--bg-elev), rgba(17, 24, 38, 0.9));
  box-shadow: var(--shadow-1);
  transition: transform var(--t-fast) var(--ease), border-color var(--t) var(--ease),
    box-shadow var(--t) var(--ease);
}

.level:hover:not(:disabled) {
  transform: translateY(-2px);
  border-color: var(--border-strong);
  box-shadow: var(--shadow-2);
}

.level:disabled {
  opacity: 0.5;
  box-shadow: none;
}

.level.passed {
  border-color: color-mix(in srgb, var(--ok) 45%, transparent);
  background:
    linear-gradient(180deg, rgba(61, 220, 151, 0.10), rgba(17, 24, 38, 0.92));
}

.level-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 2px;
}

.level-n {
  display: inline-grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: var(--r-full);
  background: var(--bg-elev-2);
  border: 1px solid var(--border-strong);
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--fg-dim);
  flex: 0 0 auto;
}

.level.passed .level-n {
  background: var(--ok);
  color: #04160e;
  border-color: transparent;
}

.level-name {
  font-weight: 700;
  font-size: 0.96rem;
  letter-spacing: -0.01em;
  min-width: 0;
  overflow-wrap: anywhere;
  line-height: 1.25;
}

.level-meta {
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 0.76rem;
  color: var(--fg-faint);
}

.stars {
  margin-left: auto;
  font-size: 0.9rem;
  letter-spacing: 2px;
  color: var(--fg-faint);
  white-space: nowrap;
}

.stars .off {
  filter: grayscale(1);
  opacity: 0.32;
}

.stars .on {
  color: var(--warn);
  text-shadow: 0 0 10px rgba(255, 180, 84, 0.45);
}

.level-lock {
  font-size: 0.82rem;
  opacity: 0.8;
  flex: 0 0 auto;
}

.level-bar {
  margin-top: 8px;
  height: 5px;
  border-radius: var(--r-full);
  background: rgba(255, 255, 255, 0.07);
  overflow: hidden;
}

.level-bar > i {
  display: block;
  height: 100%;
  border-radius: var(--r-full);
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width var(--t-slow) var(--ease);
}

/* Barra de progreso genérica */
.bar {
  height: 7px;
  border-radius: var(--r-full);
  background: rgba(255, 255, 255, 0.07);
  overflow: hidden;
}

.bar > i {
  display: block;
  height: 100%;
  border-radius: var(--r-full);
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width var(--t-slow) var(--ease);
}

.bar.bar-ok > i { background: linear-gradient(90deg, var(--ok), #7fe7c2); }
.bar.bar-warn > i { background: linear-gradient(90deg, var(--warn), #ffd7a0); }

.progress-line {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  font-size: 0.8rem;
  color: var(--fg-dim);
}

/* =========================================================================
 * 10. Juego: enunciado
 * ========================================================================= */

.stmt {
  text-align: center;
  padding: 6px 0 2px;
}

.stmt-lead {
  color: var(--fg-dim);
  font-size: 0.88rem;
  margin-bottom: 4px;
}

.stmt-eq {
  margin-top: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  padding-top: 10px;
  border-top: 1px dashed var(--border);
  color: var(--fg-dim);
  font-size: 0.9rem;
}

/* Enunciado: la fórmula se desplaza si no cabe, pero el "= ?" siempre se ve */
.stmt-eqbox {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  max-width: 100%;
  margin-top: 2px;
}

.stmt-math {
  flex: 0 1 auto;
  min-width: 0;
  max-width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
}

.eq-tail {
  flex: 0 0 auto;
  font-family: var(--font-math);
  font-size: 1.3em;
  color: var(--accent);
  white-space: nowrap;
}

.stmt-eq .what { color: var(--fg); font-weight: 700; }

.piecewise {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  margin: 4px 0 2px;
  overflow-x: auto;
  max-width: 100%;
}

.piece {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 10px;
  border-radius: var(--r-sm);
}

.piece .brace {
  align-self: stretch;
  display: flex;
  align-items: center;
  font-family: var(--font-math);
  font-size: 2.1em;
  color: var(--fg-faint);
  line-height: 0.85;
}

.piece .cond {
  font-family: var(--font-math);
  color: var(--fg-dim);
  font-size: 0.92em;
}

.piece-ask {
  margin-top: 8px;
  color: var(--accent);
  font-weight: 600;
  font-size: 0.95rem;
}

/* Objetivo: x → a, x → a⁻, x → a⁺, x → +∞, x → −∞ */
.target {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  margin-top: 10px;
  border-radius: var(--r-md);
  background: var(--bg-elev-2);
  border: 1px solid var(--border);
  max-width: 100%;
  overflow-x: auto;
}

.target-label {
  font-size: 0.74rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--fg-faint);
  white-space: nowrap;
}

.target-eq {
  color: var(--fg-dim);
  font-size: 1rem;
  white-space: nowrap;
}

.target-answer {
  color: var(--accent);
  font-weight: 700;
}

/* =========================================================================
 * 11. MathML
 * ========================================================================= */

.math,
math {
  font-family: var(--font-math);
  font-size: 1.35em;
  line-height: 1.5;
  display: block;
  max-width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  vertical-align: middle;
  white-space: nowrap;          /* una fórmula larga se desplaza, no se parte */
  -webkit-overflow-scrolling: touch;
}

.stmt .math,
.stmt math,
.piecewise math,
.step-m math,
.formula math { display: inline-block; width: auto; max-width: 100%; }

math {
  display: block;
  overflow-x: auto;
  max-width: 100%;
  padding: 2px 0;
}

/* Scrollbars discretas: un límite largo se desplaza, pero sin cantar */
.math, math, .table-wrap, .target, .piecewise, .step-m, .formula, .toc,
.qopt, .opt, .field, .nb-title {
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
}

*::-webkit-scrollbar { width: 6px; height: 6px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.16);
  border-radius: 3px;
}
*::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.28); }

math mrow { display: inline-block; }

math mfrac {
  display: inline-block;
  vertical-align: middle;
  margin: 0 0.12em;
  font-size: 0.95em;
}

/* La barra de fracción la dibuja el navegador: no la duplicamos */
math mfrac > * { padding: 0 0.28em; }
math mfrac > *:first-child { padding-bottom: 0.1em; }
math mfrac > *:last-child { padding-top: 0.1em; }

math msqrt {
  padding: 0 0.15em;
  border-top: 1px solid currentColor;
}

math mn, math mi, math mo, math mtext {
  font-family: var(--font-math);
  font-size: 1em;
}

math mo { padding: 0 0.12em; }

math mtable { margin: 0 auto; }

/* Tabla normal (no MathML) con la misma paleta */
.table-wrap {
  overflow-x: auto;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  -webkit-overflow-scrolling: touch;
}

.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
}

.table th,
.table td {
  padding: 9px 11px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}

.table thead th {
  background: var(--bg-elev-2);
  color: var(--fg-dim);
  font-weight: 600;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  white-space: nowrap;
}

.table tbody tr:last-child td { border-bottom: 0; }

.table tbody tr:hover td { background: rgba(255, 255, 255, 0.025); }

.table .t-math { font-family: var(--font-math); font-size: 1.05em; white-space: nowrap; }

/* Dentro de las tablas la fórmula no lleva caja ni scroll propio:
   manda el scroll horizontal de .table-wrap */
.table td .formula {
  display: block;
  overflow: visible;
  padding: 0;
  margin: 0;
  background: none;
  border: 0;
  border-radius: 0;
  min-width: 0;
}

.table td .formula math { overflow: visible; max-width: none; }

/* =========================================================================
 * 12. Entrada y opciones
 * ========================================================================= */

.answer-row {
  display: flex;
  gap: 8px;
  align-items: stretch;
}

.field-wrap {
  display: flex;
  flex: 1 1 auto;
  min-width: 0;
  position: relative;
}

.field {
  flex: 1 1 auto;
  width: 100%;
  min-width: 0;
  min-height: 46px;
  padding: 11px 14px;
  border-radius: var(--r-md);
  border: 1px solid var(--border-strong);
  background: var(--bg-sunken);
  color: var(--fg);
  font-family: var(--font-mono);
  font-size: 1.02rem;
  font-variant-numeric: tabular-nums;
  transition: border-color var(--t) var(--ease), box-shadow var(--t) var(--ease),
    background var(--t) var(--ease);
}

.field::placeholder {
  color: var(--fg-faint);
  font-family: var(--font);
  font-size: 0.92rem;
}

.field:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(106, 169, 255, 0.2);
  background: #050810;
}

.field:disabled { opacity: 0.5; }

.field-wrap { flex: 1 1 auto; min-width: 0; position: relative; }

.field-hint {
  margin-top: 6px;
  font-size: 0.78rem;
  color: var(--fg-faint);
}

.field-hint code {
  font-family: var(--font-mono);
  background: var(--bg-elev-2);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 0 4px;
}

.answer-row > .btn { flex: 0 0 auto; }

/* Opciones múltiples */
.opts {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  margin-top: 12px;
}

.opt {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 48px;
  padding: 10px 13px;
  border-radius: var(--r-md);
  border: 1px solid var(--border-strong);
  background: var(--bg-elev-2);
  color: var(--fg);
  font-family: var(--font-mono);
  font-size: 1rem;
  font-variant-numeric: tabular-nums;
  text-align: left;
  transition: background var(--t) var(--ease), border-color var(--t) var(--ease),
    transform var(--t-fast) var(--ease), opacity var(--t) var(--ease);
}

.opt:hover:not(:disabled) {
  background: rgba(106, 169, 255, 0.1);
  border-color: var(--accent);
  transform: translateY(-1px);
}

.opt:active:not(:disabled) { transform: translateY(0) scale(0.995); }

.opt:disabled { opacity: 0.55; }

.opt-key {
  display: inline-grid;
  place-items: center;
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: var(--r-sm);
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--fg-faint);
}

.opt-text { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }

.opt-mark { flex: 0 0 auto; font-size: 1rem; opacity: 0; transition: opacity var(--t) var(--ease); }

.opt.correct {
  border-color: var(--ok);
  background: var(--ok-soft);
  animation: pop var(--t-slow) var(--ease);
}

.opt.correct .opt-mark { opacity: 1; color: var(--ok); }

.opt.correct .opt-key {
  background: var(--ok);
  border-color: transparent;
  color: #04160e;
  font-weight: 700;
}

.opt.wrong {
  border-color: var(--err);
  background: var(--err-soft);
  animation: shake 260ms var(--ease);
}

.opt.wrong .opt-mark { opacity: 1; color: var(--err); }

.opt.wrong .opt-key {
  background: var(--err);
  border-color: transparent;
  color: #2a0308;
  font-weight: 700;
}

.opt.dimmed { opacity: 0.4; }

/* Barra de herramientas */
.tools {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed var(--border);
}

.tools .btn { flex: 0 1 auto; }

.tools .icon-btn { flex: 0 0 auto; }

.tools-right { margin-left: auto; }

.locked-note {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--fg-faint);
  font-size: 0.8rem;
}

/* =========================================================================
 * 13. Feedback
 * ========================================================================= */

.feedback {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 12px 14px;
  border-radius: var(--r-md);
  border: 1px solid var(--border-strong);
  background: var(--bg-elev-2);
  animation: fadeUp var(--t) var(--ease);
}

.feedback-ico {
  flex: 0 0 auto;
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border-radius: var(--r-full);
  font-size: 0.9rem;
  font-weight: 700;
}

.feedback-body { flex: 1 1 auto; min-width: 0; }

.feedback-title { font-weight: 700; font-size: 0.97rem; }

.feedback-reason { font-size: 0.89rem; color: var(--fg-dim); margin-top: 2px; }

.feedback.gone { border-color: color-mix(in srgb, var(--ok) 50%, transparent); background: var(--ok-soft); }
.feedback.gone .feedback-ico { background: var(--ok); color: #04160e; }
.feedback.gone .feedback-title { color: var(--ok); }

.feedback.miss { border-color: color-mix(in srgb, var(--err) 50%, transparent); background: var(--err-soft); }
.feedback.miss .feedback-ico { background: var(--err); color: #2a0308; }
.feedback.miss .feedback-title { color: var(--err); }

.feedback.faded {
  border-color: color-mix(in srgb, var(--warn) 45%, transparent);
  background: var(--warn-soft);
}
.feedback.faded .feedback-ico { background: var(--warn); color: #241301; }
.feedback.faded .feedback-title { color: var(--warn); }

.fb-xp {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 6px;
  padding: 2px 8px;
  border-radius: var(--r-full);
  background: rgba(106, 169, 255, 0.16);
  border: 1px solid rgba(106, 169, 255, 0.35);
  color: var(--accent);
  font-size: 0.78rem;
  font-weight: 700;
  animation: pop var(--t-slow) var(--ease);
}

/* =========================================================================
 * 14. Interrogatorio de método
 * ========================================================================= */

.quiz {
  border-color: rgba(167, 139, 250, 0.34);
  background:
    radial-gradient(560px 200px at 80% 0%, rgba(167, 139, 250, 0.10), transparent 70%),
    linear-gradient(180deg, var(--bg-elev), rgba(17, 24, 38, 0.92));
}

.quiz-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

.quiz-q {
  font-size: 1.02rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1.35;
  margin-bottom: 12px;
}

.quiz-q .method-name { color: var(--accent-2); }

.quiz-opts {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
}

.qopt {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  width: 100%;
  min-height: 46px;
  padding: 11px 13px;
  border-radius: var(--r-md);
  border: 1px solid var(--border-strong);
  background: var(--bg-elev-2);
  color: var(--fg);
  font-family: var(--font);
  font-size: 0.92rem;
  line-height: 1.45;
  text-align: left;
  transition: background var(--t) var(--ease), border-color var(--t) var(--ease),
    transform var(--t-fast) var(--ease), opacity var(--t) var(--ease);
}

.qopt:hover:not(:disabled) {
  background: rgba(167, 139, 250, 0.12);
  border-color: var(--accent-2);
  transform: translateY(-1px);
}

.qopt:disabled { cursor: default; }

.qopt .opt-key { margin-top: 1px; }

.qopt.correct {
  border-color: var(--ok);
  background: var(--ok-soft);
  animation: pop var(--t-slow) var(--ease);
}

.qopt.wrong {
  border-color: var(--err);
  background: var(--err-soft);
  animation: shake 260ms var(--ease);
}

.qopt.dimmed { opacity: 0.38; }

.explain {
  margin-top: 12px;
  padding: 11px 13px;
  border-radius: var(--r-md);
  border-left: 3px solid var(--accent-2);
  background: var(--accent-2-soft);
  font-size: 0.9rem;
  color: var(--fg);
  animation: fadeUp var(--t) var(--ease);
}

.explain b { color: var(--accent-2); }

/* =========================================================================
 * 15. Panel de solución
 * ========================================================================= */

.panel-solution {
  border-color: rgba(106, 169, 255, 0.3);
  background:
    radial-gradient(620px 220px at 12% 0%, rgba(106, 169, 255, 0.09), transparent 70%),
    linear-gradient(180deg, var(--bg-elev), rgba(17, 24, 38, 0.94));
}

.panel-solution .sol-head {
  font-size: 0.9rem;
  color: var(--fg-dim);
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px dashed var(--border);
}

.panel-solution .sol-head strong { color: var(--accent); font-family: var(--font-mono); }

.sol-steps {
  counter-reset: sol;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* Alias: el motor real usa <ol class="steps"> con .step-n / .step-body */
.steps {
  counter-reset: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
  list-style: none;
  margin: 12px 0 0;
}

.step-body { min-width: 0; }

.step-n {
  position: absolute;
  left: 11px;
  top: 11px;
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: var(--r-full);
  background: var(--bg-sunken);
  border: 1px solid var(--border-strong);
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--fg-dim);
}

.step.is-key .step-n,
.step.key .step-n {
  background: var(--accent);
  color: #06101f;
  border-color: transparent;
}

.sol-statement {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 10px;
  margin-bottom: 4px;
  border-radius: var(--r-md);
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  overflow-x: auto;
}

.sol-target {
  font-family: var(--font-math);
  font-size: 1.05em;
  color: var(--accent);
  white-space: nowrap;
}

.step {
  position: relative;
  padding: 11px 13px 11px 40px;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--bg-elev-2);
  counter-increment: sol;
  animation: fadeUp var(--t) var(--ease);
}

.step::before {
  content: counter(sol);
  position: absolute;
  left: 11px;
  top: 11px;
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: var(--r-full);
  background: var(--bg-sunken);
  border: 1px solid var(--border-strong);
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--fg-dim);
}

.step-t,
.step-title { font-weight: 700; font-size: 0.95rem; letter-spacing: -0.01em; }

.step-d,
.step-detail {
  margin-top: 3px;
  font-size: 0.88rem;
  color: var(--fg-dim);
  line-height: 1.5;
}

.step-m,
.step-math {
  margin-top: 8px;
  padding: 8px 10px;
  border-radius: var(--r-sm);
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  overflow-x: auto;
  max-width: 100%;
}

.step-math > math,
.step-m > math { display: inline-block; }

.steps .step { padding-left: 40px; }

.step.is-key {
  border-color: color-mix(in srgb, var(--accent) 55%, transparent);
  background: linear-gradient(180deg, rgba(106, 169, 255, 0.12), var(--bg-elev-2));
  box-shadow: 0 0 0 1px rgba(106, 169, 255, 0.14);
}

.step.is-key::before {
  background: var(--accent);
  color: #06101f;
  border-color: transparent;
}

.step.is-key .step-t,
.step.is-key .step-title,
.step.key .step-title { color: var(--accent); }

/* Si el motor numera los pasos por su cuenta, quitamos nuestro contador
   (su .step-n ya hace de número) pero dejamos el hueco para que no solape */
.engine-numbered .step { padding-left: 40px; }

.engine-numbered .step::before { display: none; }

.step-badge {
  display: inline-block;
  margin-left: 8px;
  padding: 1px 7px;
  border-radius: var(--r-full);
  background: var(--accent);
  color: #06101f;
  font-size: 0.66rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  vertical-align: 2px;
}

.sol-note {
  margin-top: 12px;
  padding: 11px 13px;
  border-radius: var(--r-md);
  border-left: 3px solid var(--warn);
  background: var(--warn-soft);
  font-size: 0.89rem;
}

/* =========================================================================
 * 16. Ajustes
 * ========================================================================= */

.settings {
  border-color: var(--border-strong);
}

.settings h3 {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--fg-faint);
  margin-bottom: 8px;
  font-weight: 700;
}

.seg {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.seg-btn {
  min-height: 40px;
  padding: 8px 6px;
  border-radius: var(--r-sm);
  border: 1px solid var(--border);
  background: var(--bg-elev-2);
  color: var(--fg-dim);
  font-size: 0.84rem;
  font-weight: 600;
  line-height: 1.25;
  transition: all var(--t) var(--ease);
}

.seg-btn:hover { border-color: var(--border-strong); color: var(--fg); }

.seg-btn.on {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: 0 0 0 1px rgba(106, 169, 255, 0.2);
}

.seg-btn small {
  display: block;
  font-size: 0.68rem;
  font-weight: 500;
  opacity: 0.7;
  margin-top: 1px;
}

.settings-note {
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: var(--r-sm);
  background: var(--bg-sunken);
  border: 1px dashed var(--border-strong);
  font-size: 0.82rem;
  color: var(--fg-dim);
}

/* =========================================================================
 * 17. Cuaderno de errores
 * ========================================================================= */

.nb-summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 8px;
  margin-bottom: 14px;
}

.nb-group { margin-bottom: 16px; }

.nb-group-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.nb-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.nb-item {
  display: block;
  padding: 11px 12px;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--bg-elev-2);
  transition: border-color var(--t) var(--ease);
}

.nb-item:hover { border-color: var(--border-strong); }

.nb-top {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}

.nb-why {
  flex: 0 0 auto;
}

.nb-info { min-width: 0; }

.nb-title {
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

.nb-meta {
  margin-top: 4px;
  font-size: 0.76rem;
  color: var(--fg-faint);
  display: flex;
  gap: 6px 10px;
  flex-wrap: wrap;
}

.how-fallo { --chip-c: var(--err); }
.how-metodo { --chip-c: var(--accent-2); }
.how-saltado { --chip-c: var(--fg-faint); }
.how-solucion { --chip-c: var(--warn); }
.how-ayudado { --chip-c: var(--accent); }
.how-acierto { --chip-c: var(--ok); }

.empty {
  text-align: center;
  padding: 30px 16px;
  color: var(--fg-dim);
}

.empty-mark {
  font-family: var(--font-math);
  font-size: 2.6rem;
  color: var(--ok);
  opacity: 0.55;
  margin-bottom: 8px;
}

.empty-title { font-weight: 700; color: var(--fg); margin-bottom: 4px; }

/* =========================================================================
 * 18. Avisos
 * ========================================================================= */

.notice {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 9px 12px;
  border-radius: var(--r-md);
  font-size: 0.85rem;
  border: 1px solid var(--border);
  background: var(--bg-elev-2);
  color: var(--fg-dim);
}

.notice-ico { flex: 0 0 auto; }

.notice-warn {
  border-color: rgba(255, 180, 84, 0.4);
  background: var(--warn-soft);
  color: #ffd9a8;
}

.notice-accent {
  border-color: rgba(106, 169, 255, 0.36);
  background: var(--accent-soft);
  color: #bcd7ff;
}

.notice-info {
  border-color: rgba(167, 139, 250, 0.36);
  background: var(--accent-2-soft);
  color: #d6c8ff;
}

.review-banner {
  margin-bottom: 12px;
  border-left: 3px solid var(--warn);
}

/* Fin de partida */
.finish {
  text-align: center;
}

.finish-title {
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: -0.03em;
}

.finish-score {
  margin: 14px 0;
  display: flex;
  justify-content: center;
  gap: 18px;
  flex-wrap: wrap;
}

.finish-score b {
  display: block;
  font-size: 1.6rem;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

.finish-score span {
  font-size: 0.75rem;
  color: var(--fg-faint);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.finish-stars { font-size: 1.7rem; letter-spacing: 6px; margin: 6px 0 4px; }

/* =========================================================================
 * 19. Teoría
 * ========================================================================= */

.theory {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}

.toc {
  position: sticky;
  top: 66px;
  align-self: start;
  padding: 12px;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--bg-elev);
}

.toc-title {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--fg-faint);
  font-weight: 700;
  margin-bottom: 8px;

AST.num = function (v) {
  if (v && typeof v === "object" && typeof v.t === "string") return v;   // ya es un nodo
  return node("num", { v: v instanceof Q ? v : Q(v) });
};
AST.var = function (name) { return node("var", { name: name || "x" }); };
AST.pow = function (a, b) { return node("pow", { a: asNode(a), b: asNode(b) }); };
AST.neg = function (a) { return node("neg", { a: asNode(a) }); };
/** Coacciona un argumento a nodo AST (acepta Q o número). */
function asNode(v) {
  if (v instanceof Q || typeof v === "number" || typeof v === "bigint" || typeof v === "string") {
    return AST.num(Q(v));
  }
  return v;
}

AST.add = function () {
  const terms = [];
  for (let i = 0; i < arguments.length; i++) {
    const t = asNode(arguments[i]);
    if (t && t.t === "add") terms.push.apply(terms, t.terms);
    else terms.push(t);
  }
  if (terms.length === 1) return terms[0];
  return node("add", { terms: terms });
};
AST.sub = function (a, b) { return node("sub", { a: asNode(a), b: asNode(b) }); };
AST.mul = function () {
  const fs = [];
  for (let i = 0; i < arguments.length; i++) {
    const f = asNode(arguments[i]);
    if (f && f.t === "mul") fs.push.apply(fs, f.fs);
    else fs.push(f);
  }
  if (fs.length === 1) return fs[0];
  return node("mul", { fs: fs });
};
AST.div = function (a, b) { return node("div", { a: asNode(a), b: asNode(b) }); };
AST.sqrt = function (a) { return node("sqrt", { a: asNode(a) }); };
AST.ln = function (a) { return node("ln", { a: asNode(a) }); };
AST.exp = function (a) { return node("exp", { a: asNode(a) }); };
AST.cos = function (a) { return node("cos", { a: asNode(a) }); };
AST.sin = function (a) { return node("sin", { a: asNode(a) }); };
AST.tan = function (a) { return node("tan", { a: asNode(a) }); };
AST.abs = function (a) { return node("abs", { a: asNode(a) }); };
AST.pi = node("pi", {});

/* --- helpers de construcción frequently usados en los generadores --- */
AST.powN = function (base, k) {
  if (k && typeof k === "object" && k.t) return AST.pow(base, k);
  return AST.pow(base, AST.num(Q(BigInt(k))));
};
AST.x = function () { return AST.var("x"); };
AST.divOf = function (num, den) { return AST.div(num, den); };
AST.lin = function (m, b) {
  const c = Q(b), mm = Q(m);
  if (mm.isZero()) return AST.num(c);
  if (c.isZero()) return mm.isOne() ? AST.x() : AST.mul(mm, AST.x());
  const mon = mm.isOne() ? AST.x() : AST.mul(mm, AST.x());
  return AST.add(mon, AST.num(c));
};

/** Polinomio → AST, en orden descendente de grado y con signos correctos. */
function polyToAST(p) {
  if (p.isZero()) return AST.num(Q.ZERO);
  const parts = [];
  for (let i = p.degree(); i >= 0; i--) {
    const c = p.coeffs[i];
    if (c.isZero()) continue;
    const mon = i === 0 ? null
      : (i === 1 ? AST.x() : AST.powN(AST.x(), i));
    const ac = c.abs();
    const term = mon === null ? AST.num(ac) : (ac.isOne() ? mon : AST.mul(AST.num(ac), mon));
    parts.push({ sign: c.sign(), ast: term });
  }
  let acc = null;
  for (const part of parts) {
    if (acc === null) acc = part.sign < 0 ? AST.neg(part.ast) : part.ast;
    else if (part.sign < 0) acc = AST.sub(acc, part.ast);
    else acc = AST.add(acc, part.ast);
  }
  return acc;
}

/* --- aplanado de sumas y productos ---------------------------------- */

/** Devuelve [{sign:±1, node}] con la suma totalmente descompuesta. */
function flattenSum(n, sign) {
  sign = sign || 1;
  switch (n.t) {
    case "add": {
      const out = [];
      for (const t of n.terms) out.push.apply(out, flattenSum(t, sign));
      return out;
    }
    case "sub": return flattenSum(n.a, sign).concat(flattenSum(n.b, -sign));
    case "neg": return flattenSum(n.a, -sign);
    default: {
      const sp = splitLeadingSign(n);
      return [{ sign: sign * sp.sign, node: sp.node }];
    }
  }
}

/** Saca el signo negativo inicial de un término (numérico o factor). */
function splitLeadingSign(n) {
  if (n.t === "num") {
    if (n.v.isNeg()) return { sign: -1, node: AST.num(n.v.neg()) };
    return { sign: 1, node: n };
  }
  if (n.t === "neg") return { sign: -1, node: n.a };
  if (n.t === "mul" && n.fs.length > 0) {
    const first = n.fs[0];
    if (first.t === "num" && first.v.isNeg()) {
      const rest = n.fs.slice(1);
      const av = first.v.neg();
      const fs = (av.isOne() ? rest : [AST.num(av)].concat(rest));
      return { sign: -1, node: fs.length === 1 ? fs[0] : AST.mul.apply(AST, fs) };
    }
  }
  return { sign: 1, node: n };
}

/** Factores de un producto, quitando los coeficientes 1 y la x^b implícita. */
function productFactors(n) {
  const fs = flattenMul(n);
  const out = [];
  for (const f of fs) {
    if (f.t === "num" && f.v.isOne()) continue;
    out.push(f);
  }
  return out.length ? out : fs;
}

function flattenMul(n) {
  if (n.t === "mul") {
    const out = [];
    for (const f of n.fs) {
      if (f.t === "mul") out.push.apply(out, flattenMul(f));
      else out.push(f);
    }
    return out;
  }
  return [n];
}

/* --- render plano ---------------------------------------------------- */

var PREC = { sum: 1, prod: 2, neg: 3, pow: 4, atom: 5 };

function wrapPlain(s, p, need) { return p < need ? "(" + s + ")" : s; }

/** ¿Se puede poner el factor siguiente sin asterisco? (3x, 2(x+1), x²) */
function implicitJoin(prev, next) {
  return /^[0-9.]+$/.test(prev) && /^[a-zA-Z(√|]/.test(next);
}

function plain(n, need) {
  need = need || 0;
  switch (n.t) {
    case "num": return n.v.toString();
    case "var": return n.name;
    case "pi": return "pi";
    case "pow": {
      const b = plain(n.a, PREC.pow);
      let e = plain(n.b, PREC.pow + 1);
      // x^2 y no x^(2)
      if (n.b.t === "num" && n.b.v.isInt()) e = n.b.v.toString();
      return wrapPlain(b + "^" + e, PREC.pow, need);
    }
    case "neg": return wrapPlain("-" + plain(n.a, PREC.prod), PREC.neg, need);
    case "div": {
      return wrapPlain(plain(n.a, PREC.prod) + "/" + plain(n.b, PREC.prod + 1), PREC.prod, need);
    }
    case "mul": {
      const sp = splitLeadingSign(n);
      const items = productFactors(sp.node).map((f) => plain(f, PREC.prod));
      let s = "";
      for (let i = 0; i < items.length; i++) {
        if (i > 0) s += implicitJoin(s, items[i]) ? "" : "*";
        s += items[i];
      }
      if (sp.sign < 0) s = "-" + s;
      return wrapPlain(s, PREC.prod, need);
    }
    case "add": case "sub": {
      const items = flattenSum(n);
      let s = "";
      for (let i = 0; i < items.length; i++) {
        const it = items[i];
        const txt = plain(it.node, PREC.prod);
        if (i === 0) s += it.sign < 0 ? "-" : "";
        else s += it.sign < 0 ? "-" : "+";
        s += txt;
      }
      return wrapPlain(s, PREC.sum, need);
    }
    case "sqrt": return "sqrt(" + plain(n.a, 0) + ")";
    case "ln": return "ln(" + plain(n.a, 0) + ")";
    case "exp": return "e^(" + plain(n.a, 0) + ")";
    case "cos": return "cos(" + plain(n.a, 0) + ")";
    case "sin": return "sen(" + plain(n.a, 0) + ")";
    case "tan": return "tan(" + plain(n.a, 0) + ")";
    case "abs": return "abs(" + plain(n.a, 0) + ")";
    default: return "?";
  }
}

AST.toPlain = function (n) { return plain(n, 0); };

/* --- LaTeX (para tests y depuración) -------------------------------- */

function latex(n, need) {
  need = need || 0;
  const par = (s, p) => (p < need ? "\\left(" + s + "\\right)" : s);
  switch (n.t) {
    case "num": return n.v.toString();
    case "var": return n.name;
    case "pi": return "\\pi";
    case "pow": return par(latex(n.a, PREC.pow) + "^{" + latex(n.b, 0) + "}", PREC.pow);
    case "neg": return par("-" + latex(n.a, PREC.prod), PREC.neg);
    case "div": return par("\\frac{" + latex(n.a, 0) + "}{" + latex(n.b, 0) + "}", PREC.prod);
    case "mul": {
      const sp = splitLeadingSign(n);
      const items = productFactors(sp.node).map((f) => latex(f, PREC.prod));
      return par((sp.sign < 0 ? "-" : "") + items.join("\\,"), PREC.prod);
    }
    case "add": case "sub": {
      const items = flattenSum(n);
      let s = "";
      items.forEach((it, i) => {
        const txt = latex(it.node, PREC.prod);
        s += i === 0 ? (it.sign < 0 ? "-" : "") : (it.sign < 0 ? " - " : " + ");
        s += txt;
      });
      return par(s, PREC.sum);
    }
    case "sqrt": return "\\sqrt{" + latex(n.a, 0) + "}";
    case "ln": return "\\ln\\left(" + latex(n.a, 0) + "\\right)";
    case "exp": return "e^{" + latex(n.a, 0) + "}";
    case "cos": return "\\cos\\left(" + latex(n.a, 0) + "\\right)";
    case "sin": return "\\sen\\left(" + latex(n.a, 0) + "\\right)";
    case "tan": return "\\tan\\left(" + latex(n.a, 0) + "\\right)";
    case "abs": return "\\left|" + latex(n.a, 0) + "\\right|";
    default: return "?";
  }
}

AST.toLatex = function (n) { return latex(n, 0); };

/* --- MathML ---------------------------------------------------------- *
 * Se construye un árbol de descriptores {name, attrs, kids|text} y luego
 * se convierte a DOM real (navegador) o a string XML (Node / tests).
 * -------------------------------------------------------------------- */

function md(name, attrs, kids) {
  return { name: name, attrs: attrs || {}, kids: kids || null, text: null };
}
function mt(name, text, attrs) {
  return { name: name, attrs: attrs || {}, kids: null, text: String(text) };
}

var MO_MINUS = "−";

function mathmlDesc(n) {
  switch (n.t) {
    case "num": {
      if (n.v.d === 1n) return mt("mn", n.v.toString());
      const neg = n.v.isNeg();
      const mag = neg ? n.v.neg() : n.v;
      return md("mfrac", {}, [
        md("mrow", {}, [neg ? mt("mo", MO_MINUS) : mt("mn", String(mag.n))]),
        mt("mn", String(n.v.d))
      ]);
    }
    case "var": return mt("mi", n.name);
    case "pi": return mt("mi", "π");
    case "pow": {
      return md("msup", {}, [mathmlDesc(n.a), expDesc(n.b)]);
    }
    case "neg": {
      return md("mrow", {}, [mt("mo", MO_MINUS), mathmlDesc(n.a)]);
    }
    case "div": {
      return md("mfrac", { displaystyle: "true" }, [mathmlDesc(n.a), mathmlDesc(n.b)]);
    }
    case "mul": {
      const fs = productFactors(n);
      const kids = [];
      fs.forEach((f, i) => {
        if (i > 0) {
          const numNext = fs[i].t === "num";
          kids.push(mt("mo", numNext ? "·" : "⁢"));
        }
        kids.push(mathmlDesc(f));
      });
      return md("mrow", {}, kids);
    }
    case "add": case "sub": {
      const items = flattenSum(n);
      const kids = [];
      items.forEach((it, i) => {
        if (i === 0) {
          if (it.sign < 0) kids.push(mt("mo", MO_MINUS));
        } else {
          kids.push(mt("mo", it.sign < 0 ? MO_MINUS : "+"));
        }
        kids.push(mathmlDesc(it.node));
      });
      return md("mrow", {}, kids);
    }
    case "sqrt": return md("msqrt", {}, [mathmlDesc(n.a)]);
    case "ln": return fnDesc("ln", n.a);
    case "cos": return fnDesc("cos", n.a);
    case "sin": return fnDesc("sen", n.a);
    case "tan": return fnDesc("tan", n.a);
    case "exp": {
      return md("msup", {}, [mt("mi", "e"), md("mrow", {}, [mt("mo", "("), mathmlDesc(n.a), mt("mo", ")")])]);
    }
    case "abs": {
      return md("mrow", {}, [mt("mo", "|", { stretchy: true }), mathmlDesc(n.a), mt("mo", "|", { stretchy: true })]);
    }
    default: return mt("mi", "?");
  }
}

/** Exponente: entero simple → mn; negativo → mrow con signo. */
function expDesc(e) {
  if (e.t === "num" && e.v.isInt()) {
    const v = e.v;
    if (v.isNeg()) return md("mrow", {}, [mt("mo", MO_MINUS), mt("mn", String(-v.n))]);
    return mt("mn", String(v.n));
  }
  if (e.t === "neg") return md("mrow", {}, [mt("mo", MO_MINUS), mathmlDesc(e.a)]);
  return mathmlDesc(e);
}

function fnDesc(name, a) {
  return md("mrow", {}, [
    mt("mi", name),
    mt("mo", "⁡"),
    md("mrow", { stretchy: "true" }, [mt("mo", "("), mathmlDesc(a), mt("mo", ")")])
  ]);
}

const MATHML_NS = "http://www.w3.org/1998/Math/MathML";

function descToElement(d) {
  let el;
  if (typeof document !== "undefined" && document.createElementNS) {
    el = document.createElementNS(MATHML_NS, d.name);
  } else {
    /* Shim mínimo para Node (tests). */
    el = {
      nodeName: d.name,
      attributes: {},
      childNodes: [],
      textContent: "",
      setAttribute(k, v) { this.attributes[k] = String(v); return this; },
      appendChild(c) { this.childNodes.push(c); return c; }
    };
  }
  for (const k in d.attrs) el.setAttribute(k, d.attrs[k]);
  if (d.text !== null && d.text !== undefined) el.textContent = d.text;
  if (d.kids) for (const k of d.kids) el.appendChild(descToElement(k));
  return el;
}

const XML_ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" };

function xmlEscape(s) {
  return String(s).replace(/[&<>"]/g, (c) => XML_ESC[c]);
}

function descToString(d) {
  let s = "<" + d.name;
  for (const k in d.attrs) s += " " + k + '="' + xmlEscape(d.attrs[k]) + '"';
  if (d.kids && d.kids.length) {
    s += ">";
    for (const k of d.kids) s += descToString(k);
    return s + "</" + d.name + ">";
  }
  if (d.text !== null && d.text !== undefined) return s + ">" + xmlEscape(d.text) + "</" + d.name + ">";
  return s + "/>";
}

/** AST → Elemento MathML del DOM (con aria-label). */
AST.toMathML = function (n) {
  const root = md("math", { xmlns: MATHML_NS, display: "inline" }, [mathmlDesc(n)]);
  const el = descToElement(root);
  if (el.setAttribute) el.setAttribute("aria-label", AST.toPlain(n));
  return el;
};

/** AST → cadena XML MathML (útil en tests y para innerHTML controlado). */
AST.toMathMLString = function (n) {
  return descToString(md("math", { xmlns: MATHML_NS, display: "inline" }, [mathmlDesc(n)]));
};

/** Comparación estructural simplificada (conmutatividad de + y ×). */
AST.equals = function (a, b) {
  if (a === b) return true;
  if (!a || !b) return false;
  if (a.t !== b.t) return false;
  switch (a.t) {
    case "num": return a.v.eq(b.v);
    case "var": return a.name === b.name;
    case "pi": return true;
    case "pow": return AST.equals(a.a, b.a) && AST.equals(a.b, b.b);
    case "neg": return AST.equals(a.a, b.a);
    case "div": return AST.equals(a.a, b.a) && AST.equals(a.b, b.b);
    case "sqrt": case "ln": case "exp": case "cos": case "sin": case "tan": case "abs":
      return AST.equals(a.a, b.a);
    case "add": case "sub": {
      const xs = flattenSum(a).map((i) => i.sign + "|" + AST.toPlain(i.node)).sort();
      const ys = flattenSum(b).map((i) => i.sign + "|" + AST.toPlain(i.node)).sort();
      return xs.length === ys.length && xs.every((v, i) => v === ys[i]);
    }
    case "mul": {
      const xs = flattenMul(a).map(AST.toPlain).sort();
      const ys = flattenMul(b).map(AST.toPlain).sort();
      return xs.length === ys.length && xs.every((v, i) => v === ys[i]);
    }
    default: return false;
  }
};

/** Valida la forma del árbol (extensión útil para los tests). */
AST.validate = function (n, depth) {
  depth = depth || 0;
  if (!n || typeof n !== "object" || typeof n.t !== "string" || depth > 200) return false;
  const okChild = (c) => AST.validate(c, depth + 1);
  switch (n.t) {
    case "num": return n.v instanceof Q;
    case "var": return typeof n.name === "string";
    case "pi": return true;
    case "pow": return okChild(n.a) && okChild(n.b);
    case "neg": return okChild(n.a);
    case "add": return Array.isArray(n.terms) && n.terms.length >= 2 && n.terms.every(okChild);
    case "sub": return okChild(n.a) && okChild(n.b);
    case "mul": return Array.isArray(n.fs) && n.fs.length >= 2 && n.fs.every(okChild);
    case "div": case "sqrt": case "ln": case "exp": case "cos": case "sin": case "tan": case "abs":
      return okChild(n.a);
    default: return false;
  }
};/* =====================================================================
 * §4  MOTOR DE LÍMITES
 * ===================================================================== */

var limit = {};

limit.FINITE = function (q) { return { kind: "finite", value: Q(q) }; };
limit.INF = function (s) { return { kind: "inf", sign: s >= 0 ? 1 : -1 }; };
limit.DNE = function () { return { kind: "dne" }; };

/** Clave comparable de un resultado. */
limit.key = function (r) {
  if (!r) return "?";
  if (r.kind === "finite") return "f:" + r.value.toString();
  if (r.kind === "inf") return "i:" + (r.sign > 0 ? "+" : "-");
  return "dne";
};

limit.equals = function (a, b) { return limit.key(a) === limit.key(b); };

/** Descripción en español del resultado (para textos y feedback). */
limit.describe = function (r) {
  if (r.kind === "finite") return "el límite es " + r.value.toDisplay();
  if (r.kind === "inf") return "el límite es " + (r.sign > 0 ? "+infinito" : "−infinito");
  return "el límite no existe";
};

/**
 * Multiplicidad de `at` como raíz de p, y valor de esa derivada.
 * p = (x-at)^m · g con g(at) ≠ 0  →  devuelve { m, der }.
 */
function multiplicityAt(p, at) {
  at = Q(at);
  let d = p;
  let k = 0;
  for (let guard = 0; guard < 64; guard++) {
    if (d.isZero()) return { m: Infinity, der: Q.ZERO };
    const v = d.eval(at);
    if (!v.isZero()) return { m: k, der: v };
    d = d.deriv();
    k++;
  }
  return { m: Infinity, der: Q.ZERO };
}

/**
 * Signo del denominador justo al lado pedido de `at` (+1 = derecha, -1 = izquierda).
 * Se usa el desarrollo de Taylor: den(x) ≈ den^(m)(at)/m! · (x-at)^m.
 */
function signDenNear(den, at, side) {
  const s = side === "-" ? -1 : 1;
  const info = multiplicityAt(den, at);
  if (info.m === Infinity) return 0;
  const c = info.der.sign();
  if (c === 0) return 0;
  const right = c;
  const left = c * (info.m % 2 === 0 ? 1 : -1);
  return s > 0 ? right : left;
}

/**
 * Límite de num/den en el punto `at`.
 *   side: "+" (derecha), "-" (izquierda), null (los dos lados).
 * El contrato lo llama `limit.rational`; `atPoint` es el mismo método.
 */
function limitAtPoint(opts) {
  let num = asPoly(opts.num);
  let den = asPoly(opts.den);
  const at = Q(opts.at);
  const side = (opts.side === "+" || opts.side === "-") ? opts.side : null;

  if (den.isZero()) return limit.DNE();
  if (side === null) return limit.bothSides({ num: num, den: den, at: at }).at;
  if (num.isZero()) {
    // 0/(x-a) vale 0 en cualquier lado (salvo si el denominador es el polinomio 0)
    return limit.FINITE(Q.ZERO);
  }

  /* Se cancelan los factores (x-at) comunes hasta que se pueda decidir. */
  for (let guard = 0; guard < 64; guard++) {
    const denAt = den.eval(at);
    const numAt = num.eval(at);
    if (!denAt.isZero()) return limit.FINITE(numAt.div(denAt));
    if (!numAt.isZero()) {
      const sn = numAt.sign();
      const sd = signDenNear(den, at, side);
      if (sd === 0) return limit.DNE();
      return limit.INF(sn * sd);
    }
    // num(at) = den(at) = 0: comprobamos multiplicidades
    const mn = multiplicityAt(num, at);
    const md = multiplicityAt(den, at);
    const common = Math.min(mn.m, md.m);
    if (!isFinite(common) || !isFinite(md.m) || common < 1) return limit.DNE();
    for (let i = 0; i < common; i++) {
      const dn = den._divLinear(at);
      const nu = num._divLinear(at);
      if (!dn || !nu) return limit.DNE();
      den = dn;
      num = nu;
    }
    if (num.isZero() || den.isZero()) return limit.DNE();
  }
  return limit.DNE();
}

/* El contrato lo llama `limit.rational`; `atPoint` es su alias. */
limit.rational = limitAtPoint;
limit.atPoint = limitAtPoint;

/**
 * Límite en el infinito de num/den.
 *   sign: "+" (x → +∞) o "-" (x → −∞)
 */
limit.infinity = function (opts) {
  const num = asPoly(opts.num);
  const den = asPoly(opts.den);
  const sign = opts.sign === "-" ? "-" : "+";
  if (den.isZero()) return limit.DNE();
  if (num.isZero()) return limit.FINITE(Q.ZERO);

  const dd = num.degree() - den.degree();

  /* Signo de p(x) cuando x tiende a ±infinito. */
  const leadSignAtInf = function (p) {
    const lc = p.leading();
    const s = lc.sign();
    if (s === 0) return 0;
    return sign === "-" ? s * (p.degree() % 2 === 0 ? 1 : -1) : s;
  };

  if (dd > 0) {
    const s = leadSignAtInf(num) * leadSignAtInf(den);
    if (s === 0) return limit.DNE();
    return limit.INF(s);
  }
  if (dd < 0) return limit.FINITE(Q.ZERO);
  return limit.FINITE(num.leading().div(den.leading()));
};

/** Los dos laterales y el valor en el punto (dne si no coinciden). */
limit.bothSides = function (opts) {
  const base = { num: asPoly(opts.num), den: asPoly(opts.den), at: Q(opts.at) };
  const left = limit.atPoint(Object.assign({}, base, { side: "-" }));
  const right = limit.atPoint(Object.assign({}, base, { side: "+" }));
  const at = limit.equals(left, right) ? left : limit.DNE();
  return { left: left, right: right, at: at };
};

/* =====================================================================
 * §5  GENERADOR PSEUDOALEATORIO DETERMINISTA
 * ===================================================================== */

/** Mezclador de semillas de 32 bits (xmur3). */
function seedMix(seed) {
  let h = seed >>> 0;
  return function () {
    h += 0x6d2b79f5;
    let t = h;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** sfc32: rápido, determinista y con buena distribución. */
function makeRng(seed) {
  const mix = seedMix(seed);
  let a = mix() * 4294967296 >>> 0;
  let b = mix() * 4294967296 >>> 0;
  let c = mix() * 4294967296 >>> 0;
  let d = mix() * 4294967296 >>> 0;
  const next = function () {
    a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
    let t = (a + b) | 0;
    a = b ^ (b >>> 9);
    b = (c + (c << 3)) | 0;
    c = (c << 21) | (c >>> 11);
    d = (d + 1) | 0;
    t = (t + d) | 0;
    c = (c + t) | 0;
    return (t >>> 0) / 4294967296;
  };
  /* Descarta los primeros valores para des-correlacionar semillas parecidas. */
  for (let i = 0; i < 12; i++) next();

  const rng = next;
  rng.seed = seed;
  rng.int = function (min, max) {
    min = Math.ceil(min);
    max = Math.floor(max);
    if (max < min) return min;
    return min + Math.floor(next() * (max - min + 1));
  };
  rng.pick = function (arr) { return arr[Math.floor(next() * arr.length) % arr.length]; };
  rng.bool = function (p) { return next() < (p === undefined ? 0.5 : p); };
  rng.shuffle = function (arr) {
    const out = arr.slice();
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(next() * (i + 1));
      const t = out[i];
      out[i] = out[j];
      out[j] = t;
    }
    return out;
  };
  /** Entero no nulo en [-m, m]. */
  rng.nonzero = function (m) {
    let v = 0;
    for (let i = 0; i < 30 && v === 0; i++) v = rng.int(-m, m);
    return v === 0 ? 1 : v;
  };
  /** Coeficiente "bonito": entero no nulo en [-m, m], nunca 0 ni 1 si se puede. */
  rng.coef = function (m, allowOne) {
    const opts = [];
    for (let i = -m; i <= m; i++) {
      if (i === 0) continue;
      if (!allowOne && (i === 1 || i === -1)) continue;
      opts.push(i);
    }
    return opts.length ? rng.pick(opts) : 1;
  };
  return rng;
}/* =====================================================================
 * §6  AYUDAS INTERNAS (respuestas, quizzes, pasos, formateo)
 * ===================================================================== */

/* --- Respuestas (objetos Answer del contrato) --- */
function ansRational(q) { return { kind: "rational", value: Q(q) }; }
function ansInf(s) { return { kind: "infinite", sign: s >= 0 ? 1 : -1 }; }
function ansDne() { return { kind: "dne" }; }
function ansChoice(options, correct) {
  return { kind: "choice", options: options.slice(), correct: correct };
}
function ansText(value) { return { kind: "text", value: String(value) }; }
function ansNumeric(v) { return { kind: "numeric", value: round6(v) }; }

/** Redondeo a 6 decimales (para resultados no racionales). */
function round6(v) {
  if (!isFinite(v)) return 0;
  return Number(v.toFixed(6));
}

/**
 * Formato para textos: los negativos usan el signo tipográfico "−"
 * (igual que en las fórmulas) y se omiten los signos + delante.
 */
/** Con signo, sin espacio detrás: "−3", "+4", "−2/x". */
function fmtSign(v) {
  return (v < 0 ? "−" : "+") + Math.abs(v);
}

/** Término con signo y espacio: "x² + 4", "x² − 3". */
function fmtTerm(v) {
  return (v < 0 ? "− " : "+ ") + Math.abs(v);
}


/** Formato español con coma decimal (solo para textos). */
function fmtDec(v, dec) {
  dec = dec === undefined ? 6 : dec;
  let s = Number(v).toFixed(dec);
  if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, "");
  return s.replace("-", "−").replace(".", ",");
}

/**
 * Clave comparable de una Answer (para no repetir distractores).
 * Las respuestas racionales y numéricas que valen lo mismo se consideran
 * la misma clave: si no, un distractor 0 colaría cuando la respuesta es 0.
 */
function answerKeyOf(a) {
  if (!a) return "?";
  switch (a.kind) {
    case "rational": return "#:" + Q(a.value).toNumber();
    case "infinite": return "i:" + (a.sign > 0 ? "+" : "-");
    case "dne": return "dne";
    case "numeric": return "#:" + Number(a.value);
    case "text": return "t:" + normText(a.value);
    case "choice": return "c:" + a.options.map(normText).join("|") + ":" + a.correct;
    default: return "?";
  }
}

/** Normaliza un texto para comparar: minúsculas, sin espacios sobrantes. */
function normText(s) {
  return String(s).toLowerCase()
    .replace(/[−–—]/g, "-")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ").trim();
}

/** Normalización fuerte para comparar respuestas de texto ("x = 3" ≈ "x=3"). */
function normAnswerText(s) {
  return String(s).toLowerCase()
    .replace(/[−–—]/g, "-")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/\s*(=)\s*/g, "=")
    .replace(/\s+/g, "");
}

/** Elige 3 distractores distintos de la respuesta correcta. */
function dist3(answer, candidates) {
  const good = [];
  const seen = {};
  seen[answerKeyOf(answer)] = true;
  const push = function (c) {
    if (!c) return;
    const k = answerKeyOf(c);
    if (seen[k]) return;
    seen[k] = true;
    good.push(c);
  };
  for (const c of (candidates || [])) push(c);
  /* Reserva de seguridad: siempre hay 3 alternativas con sentido. */
  const pool = [
    ansInf(1), ansInf(-1), ansDne(),
    ansRational(Q.ZERO), ansRational(Q.ONE), ansRational(Q.minusOne)
  ];
  if (answer.kind === "rational") {
    pool.push(ansRational(answer.value.add(Q.ONE)));
    pool.push(ansRational(answer.value.sub(Q.ONE)));
    pool.push(ansRational(answer.value.mul(Q.TWO)));
  }
  if (answer.kind === "numeric") {
    pool.push(ansNumeric(answer.value + 1));
    pool.push(ansNumeric(answer.value - 1));
  }
  if (answer.kind === "text") {
    pool.push(ansText(answer.value + " (otra)"));
  }
  for (const c of pool) { if (good.length >= 3) break; push(c); }
  if (good.length < 3) throw new Error("No se han podido construir 3 distractores");
  return good.slice(0, 3);
}

/* --- Quizzes --- */
const INDET_OPCIONES = ["0/0", "∞/∞", "∞−∞", "0·∞", "1^∞", "no hay indeterminación"];

/** Interrogatorio de indeterminación: 4 de las 6 etiquetas posibles. */
function quizIndet(correctLabel, rand, explain) {
  const others = INDET_OPCIONES.filter((o) => o !== correctLabel);
  const picked = rand.shuffle(others).slice(0, 3);
  const options = rand.shuffle([correctLabel].concat(picked));
  return {
    kind: "indeterminacion",
    question: "¿Qué indeterminación aparece al sustituir?",
    options: options,
    correct: options.indexOf(correctLabel),
    explain: explain
  };
}

/** Pregunta múltiple con el método correcto y 3 métodos que los alumnos confunden. */
function quizMC(kind, question, correctText, distractors, rand, explain) {
  const options = rand.shuffle([correctText].concat(distractors.slice(0, 3)));
  return {
    kind: kind,
    question: question,
    options: options,
    correct: options.indexOf(correctText),
    explain: explain
  };
}

/* --- Pasos y problemas --- */
function mkStep(title, detail, math, key) {
  return { title: title, detail: detail, math: math || null, key: !!key };
}

function buildProblem(gen, rand, parts) {
  const p = {
    id: gen.id + "-" + rand.seed,
    seed: rand.seed,
    generatorId: gen.id,
    title: gen.title,
    topic: gen.topic,
    difficulty: gen.difficulty,
    method: gen.method,
    statement: parts.statement,
    answer: parts.answer,
    quiz: parts.quiz,
    steps: parts.steps,
    keyStep: parts.keyStep === undefined ? 0 : parts.keyStep,
    distractors: parts.distractors
  };
  if (parts.internal) p.internal = parts.internal;
  return p;
}

function targetPoint(at, side) { return { type: "point", at: Q(at), side: side || null }; }
function targetInf(sign) { return { type: "infinity", sign: sign === "-" ? "-" : "+" }; }

/** Expresión AST de un cociente num/den. */
function ratioAST(num, den) { return AST.div(polyToAST(num), polyToAST(den)); }

/** Etiqueta legible del punto o dirección del límite. */
function targetLabel(t) {
  if (!t) return "";
  if (t.type === "infinity") return "x → " + (t.sign === "-" ? "−infinito" : "+infinito");
  const a = t.at.toDisplay();
  if (t.side === "+") return "x → " + a + "⁺";
  if (t.side === "-") return "x → " + a + "⁻";
  return "x → " + a;
}

/** Factorización legible de un polinomio como AST: lc·(x−r)(x−r)·resto. */
function factorAST(p) {
  if (p.isZero()) return AST.num(Q.ZERO);
  const fa = p.factorAll();
  const fs = [];
  for (const item of fa.linear) {
    const base = AST.sub(AST.x(), AST.num(item.root));
    fs.push(item.mult > 1 ? AST.pow(base, AST.num(Q(BigInt(item.mult)))) : base);
  }
  if (!fa.rest.isZero() && fa.rest.degree() >= 1) fs.push(polyToAST(fa.rest));
  const lc = p.leading();
  if (!lc.isOne() || fs.length === 0) fs.unshift(AST.num(lc));
  if (fs.length === 1) return fs[0];
  return AST.mul.apply(AST, fs);
}

/** Polinomio x^k. */
function xPow(k) {
  const cf = [];
  for (let i = 0; i < k; i++) cf.push(Q.ZERO);
  cf.push(Q.ONE);
  return new Poly(cf);
}

/**
 * Texto de p(x)/x^deg, mostrando los términos que han bajado de grado
 * como 1/x^k. Se usa en los pasos de "dividir entre x^n".
 */
function fitText(p, deg) {
  if (p.isZero()) return "0";
  const partes = [];
  for (let i = p.degree(); i >= 0; i--) {
    const c = p.coeffs[i];
    if (c.isZero()) continue;
    const k = i - deg;
    const mag = c.abs();
    /* con potencias positivas no se escribe el 1 (x^3); en las negativas sí
       (1/x^3), que se lee mejor */
    const coef = (mag.isOne() && k > 0) ? "" : mag.toDisplay();
    const signo = c.isNeg() ? (partes.length ? " − " : "−") : (partes.length ? " + " : "");
    if (k === 0) partes.push(signo + coef);
    else if (k > 0) partes.push(signo + coef + "x" + (k === 1 ? "" : "^" + k));
    else partes.push(signo + coef + "/x" + (-k === 1 ? "" : "^" + -k));
  }
  return partes.length ? partes.join("") : "0";
}

/** Texto de un polinomio para los `detail` de los pasos. */
function polyText(p) { return p.isZero() ? "0" : p.toString(); }

/**
 * Texto de m·x + b con signos y espacios correctos ("−4x − 3", "2x + 2",
 * "3", "−3"). Se usa en los pasos donde la expresión es larga.
 */
function linTxt(m, b) {
  const M = Number(m), B = Number(b);
  if (M === 0) return B === 0 ? "0" : fmtTerm(B).trim();
  const ini = M === 1 ? "x" : (M === -1 ? "−x" : fmtSign(M) + "x");
  if (B === 0) return ini;
  return ini + " " + fmtTerm(B).trim();
}

/** Texto de un cociente de racionales, con el signo bien puesto: "-1/3". */
function ratioTxt(a, b) {
  a = Q(a); b = Q(b);
  const r = a.div(b);
  return (r.isNeg() ? "−" : "") + r.abs().toDisplay();
}

/** Texto de k + b/x (útil al dividir entre x^n). */
function invTxt(k, b) {
  const K = Number(k), B = Number(b);
  if (K === 0 && B === 0) return "0";
  let out = K === 0 ? "" : (K === 1 ? "1" : K === -1 ? "−1" : String(K));
  if (B !== 0) out += (out ? " " + fmtSign(B).replace(/([−+])/, "$1 ") : (B === 1 ? "1" : B === -1 ? "−1" : String(B))) + "/x";
  return out;
}

/** Polinomio de grado exactamente `deg`, con coeficientes LEADING y aleatorios. */
function randPoly(rand, deg, lead, constLead) {
  const cf = [rand.int(-4, 4), rand.int(-4, 4), rand.int(-4, 4), rand.int(-4, 4)];
  if (lead === undefined) lead = rand.coef(3, constLead !== false);
  switch (deg) {
    case 0: return Poly.constant(cf[0]);
    case 1: return Poly.lin(lead, cf[0]);
    case 2: return Poly.quad(lead, cf[0], cf[1]);
    case 3: return Poly.cubic(lead, cf[0], cf[1], cf[2]);
    default: return Poly.from([cf[0], cf[1], cf[2], cf[3], lead]);
  }
}

/* ---------- 21. función a trozos: límites laterales ---------- */
/**
 * Construye una función a trozos cuyo punto de unión es `a`.
 * Devuelve el primer trozo (polinomio), el segundo (polinomio o cociente),
 * su texto y el valor del límite por la derecha (todo exacto con Q).
 *
 * @param forzarContinua si es true se busca un segundo trozo que coincida
 *        con el primero en el punto, para que el ejercicio tenga sentido.
 */
function makePieces(rand, a, forzarContinua) {
  const at = Q(a);
  const p1 = Poly.quad(1, rand.int(-3, 3), rand.int(-4, 4));
  const izquierda = p1.eval(at);
  const lder = Poly.lin(1, rand.int(-5, 5));
  const derecha = lder.eval(at);

  if (rand.bool(0.5)) {
    /* Segundo trozo lineal: se elige la pendiente para que cuadre o no. */
    const c = forzarContinua ? derecha.toNumber() : rand.int(-5, 5);
    const m = c - a;
    if (m === 0 || Math.abs(m) > 8) return makePieces(rand, a, forzarContinua);
    const p2 = Poly.lin(m, -m * a + c);
    return {
      p1: p1, ast1: p1.toAST(), ast2: p2.toAST(), texto2: polyText(p2),
      izquierda: izquierda, derecha: p2.eval(at), racional: false
    };
  }

  /* Segundo trozo racional (m·x + n)/(x + w), con w ≠ −a */
  const m = rand.coef(3, true);
  let w = rand.int(-2, 2);
  let intentos = 0;
  while (w === -a && intentos++ < 8) w = rand.int(-2, 2);
  if (w === -a) w = -a + 1;
  /* n se elige para que el cociente valga `objetivo` en x = a */
  const objetivo = forzarContinua ? izquierda : Q(BigInt(rand.int(-4, 4)));
  const n = objetivo.mul(at.add(Q(BigInt(w)))).sub(Q(BigInt(m)).mul(at));
  const num = Poly.lin(m, n);
  const den = Poly.lin(1, w);
  return {
    p1: p1, ast1: p1.toAST(), ast2: AST.div(num.toAST(), den.toAST()),
    texto2: "(" + polyText(num) + ")/" + polyText(den),
    izquierda: izquierda, derecha: num.eval(at).div(den.eval(at)), racional: true
  };
}

      /* segundo trozo lineal: m·x + n, con n elegido para el límite L */
      const L = sinSolucion ? b + rand.nonzero(3) : pv * a + b;
      const p2 = Poly.lin(m, L - m * a);
      ast2 = p2.toAST();
      texto2 = polyText(p2);
      der = Q(BigInt(L));
    } else {
      /* segundo trozo cociente (u·x + v)/(x + w), con el numerador elegido
         para que el cociente valga L en x = a */
      let u = rand.coef(3, true);
      while (u === pv) u = (u + 1 <= 3 ? u + 1 : u - 1);
      let w = rand.int(-2, 2);
      let intentos = 0;
      while (w === -a && intentos++ < 8) w = rand.int(-2, 2);
      if (w === -a) w = -a + 1;
      const L = sinSolucion ? b + rand.nonzero(3) : pv * a + b;
      const num = Poly.lin(u, L * (u * a + w) - u * a * a);
      const den = Poly.lin(1, w);
      ast2 = AST.div(num.toAST(), den.toAST());
      texto2 = "(" + polyText(num) + ")/(" + polyText(den) + ")";
      der = num.eval(Q(a)).div(den.eval(Q(a)));
    }

    const piezas = [
      { expr: p1.toAST(), cond: "x ≤ " + a, condType: "le" },
      { expr: ast2, cond: "x > " + a, condType: "gt" }
    ];

    const pasos = [
      mkStep("Condición de continuidad en el punto de unión",
        "Para que f sea continua en x = " + a + " tiene que cumplirse que el valor del primer trozo, f(" + a +
        "), sea igual al límite del segundo trozo por la derecha.",
        p1.toAST(), true),
      mkStep("El primer trozo da f(" + a + ")",
        "Como " + a + " pertenece al primer trozo, f(" + a + ") = " + pv + "·" + a + " " + fmtTerm(b).trim() +
        " = " + Q(BigInt(pv * a + b)).toDisplay() + ".",
        p1.toAST()),
      mkStep("El segundo trozo da el límite por la derecha",
        "El segundo trozo es " + texto2 + ". Su límite por la derecha en x = " + a + " es " + der.toDisplay() +
        ", y el denominador no se anula en ese punto, así que basta con sustituir.",
        ast2)
    ];

    let ans, cands, detalleFinal;
    if (sinSolucion) {
      ans = ansText("no existe ningún valor de p");
      cands = [ansRational(Q.ZERO), ansRational(Q.ONE), ansRational(Q.minusOne)];
      pasos.push(mkStep("Conclusión",
        "f(" + a + ") = " + b + " no depende de p, pero el límite por la derecha es " + der.toDisplay() +
        ". Son distintos, así que ningún valor de p arregla la discontinuidad: es una discontinuidad de salto.",
        AST.num(Q(BigInt(b)))));
      detalleFinal = "Ningún valor de p hace la función continua: f(0) = " + b + " y el límite por la derecha es " + der.toDisplay() + ".";
    } else {
      const pBuscado = der.sub(Q(BigInt(b))).div(Q(BigInt(a)));   // p = (L − b)/a
      ans = ansRational(pBuscado);
      cands = [ansRational(pBuscado.neg()), ansRational(Q(BigInt(b))), ansRational(Q.ZERO)];
      pasos.push(mkStep("Igualamos y despejamos",
        pv + "·" + a + " " + fmtTerm(b).trim() + " = " + der.toDisplay() + " → " + pv + "·" + a + " = " +
        der.sub(Q(BigInt(b))).toDisplay() + " → p = " + pBuscado.toDisplay() + ".",
        AST.num(pBuscado)));
      detalleFinal = "El único valor que funciona es p = " + pBuscado.toDisplay() + ".";
    }
    return buildProblem(this, rand, {
      statement: {
        expr: p1.toAST(),
        target: targetPoint(Q(a), null),
        kind: "continuity",
        pieces: piezas,
        pieceParams: { p: "p" },
        question: sinSolucion
          ? "¿Existe algún valor de p para que f sea continua en x = " + a + "? Si no existe, di cuál es la discontinuidad."
          : "Calcula el valor de p para que f sea continua en x = " + a + "."
      },
      answer: ans,
      quiz: quizMC("metodo", "¿Qué condición hay que imponer?",
        "Igualar el valor del primer trozo en el punto con el límite del segundo",
        ["Igualar los coeficientes de las dos fórmulas",
          "Hacer que las dos fórmulas coincidan en todo su tramo",
          "Basta con que el denominador del segundo trozo no se anule"],
        rand,
        "La continuidad solo exige que f(" + a + ") (primer trozo) coincida con el límite por la derecha (segundo trozo). " + detalleFinal),
      steps: pasos,
      keyStep: 0,
      distractors: dist3(ans, cands),
      internal: { f_a: Q(BigInt(pv * a + b)), limiteDer: der, at: Q(a), p: Q(BigInt(pv)) }
    });
  }
