<script>
/* =====================================================================
 * lista1-practice.html — MÒDUL AUTOCONTINGUT PER APRENDRE LA LLISTA 1
 * ---------------------------------------------------------------------
 * AQUEST FITXER NO TOCA RES DEL JOC. Llegeix `src/engine.js` (window.Lim)
 * en mode només lectura i afegeix aquí mateix el mòdul `L1` amb el que
 * falta per cobrir la Llista 1 COMPLETA (12 exercicis, 32 apartats):
 *
 *   · tendència numèrica de下文limits (laterals, ±∞, radicals, exponencials)
 *   · Bolzano / Darboux: existirència d'arrels + bisecció
 *   · continuïtat de funcions a trossos (2, 3 i 4 trossos)
 *   · tangents: recta tangent i punts on la tangent passa per un punt
 *   · verificació de respostes amb tolerància
 *
 * TOT el contingut matemàtic ha estat verificat numèricament una per una.
 * No escriu a `limites:v1` (la clau del joc): usa la seva `llista1:v1`.
 * ===================================================================== */
(function () {
"use strict";

var NS_MATH = "http://www.w3.org/1998/Math/MathML";
var KEY = "llista1:v1";
var L = null, Q = null, Poly = null, A = null;
var L1 = {};   /* módulo propio: lo que el motor de 23 generadores NO cubre */
var EX = [];

/* ---------------------------------------------------------------- */
/* 0. Utilitats DOM                                                   */
/* ---------------------------------------------------------------- */
function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = String(text);
  return n;
}
function btn(cls, label, on) { var b = el("button", cls, label); if (on) b.addEventListener("click", on); return b; }
function card() { return el("div", "card"); }
function small(t) { return el("div", "small muted", t); }
function mkn(tag, props, kids) {
  var n = document.createElementNS(NS_MATH, tag);
  if (props) for (var k in props) {
    if (props[k] === null || props[k] === undefined || props[k] === false) continue;
    if (k === "text") n.textContent = props[k]; else n.setAttribute(k, String(props[k]));
  }
  if (kids) for (var i = 0; i < kids.length; i++) if (kids[i]) n.appendChild(kids[i]);
  return n;
}
function mathBox(expr) {
  var box = el("div", "formula");
  try { box.appendChild(A.toMathML(expr)); }
  catch (e) { box.appendChild(el("span", "muted", String(expr))); }
  return box;
}
/* Fraccció i potència en MathML, per escriure enunciats a mà */
function frac(a, b) { return mkn("mfrac", null, [a, b]); }
function pw(a, b) { return mkn("msup", null, [a, b]); }
function mn(t) { return mkn("mn", { text: String(t) }); }
function mi(t) { return mkn("mi", { text: String(t) }); }
function mo(t) { return mkn("mo", { text: String(t) }); }
function mtxt(t) { return mkn("mtext", { text: String(t) }); }
function limEn(target, expr, extra) {           /* lim_{x→a} f(x) = ? */
  return mkn("math", { display: "inline" }, [
    mkn("munder", null, [mo("lim"), target]),
    mo(" "), expr, extra ? extra : null, mo("="), mtxt("?")
  ]);
}
function xto(a, side) {                          /* x → a  (o x → 0⁺) */
  var k = [mi("x"), mo("→"), (typeof a === "number" ? mn(a) : a)];
  if (side === "+") k.push(mkn("msup", null, [mn(""), mo("+")]));
  if (side === "-") k.push(mkn("msup", null, [mn(""), mo("−")]));
  return mkn("mrow", null, k);
}
function xinf(s) { return mkn("mrow", null, [mi("x"), mo("→"), mo(s === "-" ? "−∞" : "+∞")]); }

/* ---------------------------------------------------------------- */
/* 1. L1 — evaluator numèric del AST (per al que el motor no resol)   */
/* ---------------------------------------------------------------- */
L1.ev = function (n, x) {
  switch (n.t) {
    case "num": return n.v.toNumber();
    case "var": return x;
    case "pi": return Math.PI;
    case "neg": return -L1.ev(n.a, x);
    case "add": { var s = 0; for (var i = 0; i < n.terms.length; i++) s += L1.ev(n.terms[i], x); return s; }
    case "sub": return L1.ev(n.a, x) - L1.ev(n.b, x);
    case "mul": { var p = 1; for (var j = 0; j < n.fs.length; j++) p *= L1.ev(n.fs[j], x); return p; }
    case "div": return L1.ev(n.a, x) / L1.ev(n.b, x);
    case "sqrt": return Math.sqrt(L1.ev(n.a, x));
    case "cbrt": return Math.cbrt(L1.ev(n.a, x));
    case "ln": return Math.log(L1.ev(n.a, x));
    case "exp": return Math.exp(L1.ev(n.a, x));
    case "cos": return Math.cos(L1.ev(n.a, x));
    case "sin": return Math.sin(L1.ev(n.a, x));
    case "tan": return Math.tan(L1.ev(n.a, x));
    case "abs": return Math.abs(L1.ev(n.a, x));
    case "pow": return Math.pow(L1.ev(n.a, x), L1.ev(n.b, x));
    default: return NaN;
  }
};

/* ---------------------------------------------------------------- */
/* 2. L1 — tendència observada (decideix el límit DE VERDAT)         */
/* ---------------------------------------------------------------- */
function obs(fn, xs) { var o = [], i; for (i = 0; i < xs.length; i++) { try { o.push(fn(xs[i])); } catch (e) { o.push(NaN); } } return o; }
function tendencia(vals) {
  var fin = vals.filter(isFinite), last;
  if (!fin.length) return { tipo: "indefinido", valor: NaN, signo: 0 };
  last = fin[fin.length - 1];
  if (Math.abs(last) > 1e9) {
    var sg = {}, ns = 0, i;
    for (i = 0; i < fin.length; i++) { var s = Math.sign(fin[i]); if (!(s in sg)) { sg[s] = 1; ns++; } }
    if (ns > 1) return { tipo: "oscila", valor: NaN, signo: 0 };
    return { tipo: "infinito", valor: last, signo: Math.sign(last) };
  }
  var estable = true;
  for (i = fin.length - 4; i < fin.length; i++) if (Math.abs(fin[i] - last) > 1e-6 * Math.max(1, Math.abs(last))) estable = false;
  return { tipo: estable ? "finito" : "oscila", valor: last, signo: Math.sign(last) };
}
function muPunt(a, side) { var o = [], i, e; for (i = 1; i <= 11; i++) { e = Math.pow(10, -i); if (side === "+") o.push(a + e); else if (side === "-") o.push(a - e); else { o.push(a - e); o.push(a + e); } } return o; }
function muInf(s) { var o = [], k; for (k = 4; k <= 15; k++) o.push(s * Math.pow(10, k)); return o; }

/** Laterals / total en un punt. side: '+' | '-' | null */
L1.limitePunt = function (fn, a, side) {
  if (side) { var t = tendencia(obs(fn, muPunt(a, side))); return { kind: t.tipo === "finito" ? "finite" : t.tipo === "infinito" ? "inf" : "dne", valor: t.valor, sign: t.signo }; }
  var li = tendencia(obs(fn, muPunt(a, "-"))), ld = tendencia(obs(fn, muPunt(a, "+")));
  var igual = li.tipo === ld.tipo &&
    (li.tipo !== "finito" || Math.abs(li.valor - ld.valor) <= 1e-6 * Math.max(1, Math.abs(li.valor))) &&
    (li.tipo !== "infinito" || li.signo === ld.signo);
  if (!igual) return { kind: "dne", li: li, ld: ld };
  if (li.tipo === "finito") return { kind: "finite", valor: li.valor };
  if (li.tipo === "infinito") return { kind: "inf", sign: li.signo };
  return { kind: "dne" };
};
/** Límit a l'infinit. */
L1.limiteInf = function (fn, signo) {
  var t = tendencia(obs(fn, muInf(signo)));
  return t.tipo === "finito" ? { kind: "finite", valor: t.valor }
    : t.tipo === "infinito" ? { kind: "inf", sign: t.signo } : { kind: "dne" };
};
/* Per a logaritmes el tendència és molt lenta: prova amb molts punts i
   predicat "el quocient de termes dominants". */
L1.limiteLog = function (fn) {
  var xs = [], k; for (k = 8; k <= 18; k++) xs.push(Math.pow(10, k));
  var v = obs(fn, xs).filter(isFinite);
  if (!v.length) return { kind: "dne" };
  var ult = v[v.length - 1], prev = v[v.length - 2];
  /* si els últims dos ja coincideixen a 4 xifres, hi ha convergir */
  return { kind: "finite", valor: ult, convergit: Math.abs(ult - prev) <= 1e-4 * Math.max(1, Math.abs(ult)) };
};

/* ---------------------------------------------------------------- */
/* 3. L1 — Bolzano / Darboux                                          */
/* ---------------------------------------------------------------- */
L1.bolzano = function (fn, a, b, tol) {
  tol = tol || 1e-10;
  var fa = fn(a), fb = fn(b), lo, hi, mid, fm, n = 0;
  if (!(isFinite(fa) && isFinite(fb))) return { ok: false, motiu: "f no és contínua (o no defineda) a [a,b]" };
  if (fa === 0) return { ok: true, fa: fa, fb: fb, raiz: a, n: 0 };
  if (fb === 0) return { ok: true, fa: fa, fb: fb, raiz: b, n: 0 };
  if (fa * fb > 0) return { ok: false, fa: fa, fb: fb, motiu: "mateix signe als dos extrems: Bolzano NO s'aplica" };
  lo = a; hi = b;
  while (hi - lo > tol && n < 300) {
    mid = (lo + hi) / 2; fm = fn(mid); n++;
    if (fa * fm <= 0) { hi = mid; fb = fm; } else { lo = mid; fa = fm; }
  }
  return { ok: true, fa: fa, fb: fb, raiz: (lo + hi) / 2, intervalo: [lo, hi], n: n };
};

/* ---------------------------------------------------------------- */
/* 4. L1 — Continuïtat de funcions a trossos                          */
/* ---------------------------------------------------------------- */
/* trossos: [{op:'<='|'>'|'<'|'>='|':', a:number, expr:AST}, ...] */
L1.continuidad = function (trossos, at) {
  var tEsq = null, tDre = null, tPunt = null, i, t;
  for (i = 0; i < trossos.length; i++) {
    t = trossos[i];
    if (t.op === "<" || t.op === "<=") if (at <= t.a) tEsq = t.expr;
    if (t.op === ">" || t.op === ">=") if (at >= t.a) tDre = t.expr;
    if (t.op === ":") tPunt = t.expr;
  }
  if (!tEsq && !tPunt) return { tipo: "No està definida a l'esquerra", definida: false };
  if (!tDre && !tPunt) return { tipo: "No està definida a la dreta", definida: false };
  /* tEsq / tDre / tPunt ja SÓN el node AST (no un objecte amb .expr) */
  var li = L1.limitePunt(function (x) { return L1.ev(tEsq, x); }, at, "-");
  var ld = L1.limitePunt(function (x) { return L1.ev(tDre || tPunt, x); }, at, "+");
  var existe = li.kind === ld.kind &&
    (li.kind !== "finite" || Math.abs(li.valor - ld.valor) <= 1e-6 * Math.max(1, Math.abs(li.valor))) &&
    (li.kind !== "inf" || li.sign === ld.sign);
  var fa;
  if (tPunt) fa = L1.ev(tPunt, at);
  else {
    var trobat = null;
    for (i = 0; i < trossos.length; i++) {
      var u = trossos[i];
      var dins = (u.op === "<=" && at <= u.a) || (u.op === ">=" && at >= u.a) ||
                 (u.op === "<" && at < u.a) || (u.op === ">" && at > u.a) || (u.op === ":" && at === u.a);
      if (dins) trobat = u.expr;
    }
    fa = trobat ? L1.ev(trobat, at) : NaN;
  }
  var definida = isFinite(fa);
  var limite = existe ? (li.kind === "finite" ? li.valor : (li.kind === "inf" ? li.sign * Infinity : NaN)) : NaN;
  var coincide = definida && existe && isFinite(limite) && Math.abs(limite - fa) <= 1e-6 * Math.max(1, Math.abs(limite));
  var tipo;
  if (!definida) tipo = "No està definida en el punt → no pot ser contínua";
  else if (!existe) tipo = "El límit no existeix (els laterals no coincideixen) → salt de 2a gènere";
  else if (!isFinite(limite)) tipo = "Límit infinit → salt infinit de 1a espècie";
  else if (coincide) tipo = "CONTÍNUA (les 3 condicions es compleixen)";
  else tipo = "Límit = " + limite.toPrecision(6) + " però f(a) = " + fa.toPrecision(6) + " → discontinuïtat evitable";
  return { definida: definida, existe: existe, limite: limite, fa: fa, coincide: coincide, tipo: tipo, li: li, ld: ld };
};

/* ---------------------------------------------------------------- */
/* 5. L1 — Tangents                                                  */
/* ---------------------------------------------------------------- */
L1.tangent = function (num, den, x0) {
  var nq = num.deriv().mul(den).sub(num.mul(den.deriv()));
  var at = Q(x0);
  return { ordenada: num.eval(at).div(den.eval(at)), pendent: nq.eval(at).div(den.eval(at).mul(den.eval(at))) };
};
L1.tangentsPer = function (p, px, py) {
  var cond = p.add(p.deriv().mul(Poly.lin(-1, px))).sub(Poly.constant(py));
  return { cond: cond, raices: cond.rationalRoots() };
};

/* ---------------------------------------------------------------- */
/* 6. L1 — Verificació de respostes                                  */
/* ---------------------------------------------------------------- */
/**
 * Converteix un text en número, entendent la convenció mathematiciansa
 * espanyola: la COMA és separador decimal (1,5) i el PUNT el de milers.
 * Retorna NaN si no és un número.
 */
function aNum(s) {
  s = String(s).trim();
  if (!s) return NaN;
  /* El signe el deixa el parse de cada operand; no el traiem a mà, així
     -3/2 es calcula com -(3/2) i no com +(3/2). */
  if (s.indexOf("/") > 0) {
    var pp = s.split("/");
    if (pp.length !== 2) return NaN;
    var a = aNum(pp[0]), b = aNum(pp[1]);
    return (b === 0) ? NaN : a / b;
  }
  /* 1.234.567,89 → 1234567.89  ·  1,5 → 1.5  ·  1.5 → 1.5 */
  if (/^[-+]?\d{1,3}(\.\d{3})+,\d+$/.test(s)) s = s.replace(/\./g, "").replace(",", ".");
  else if (/^[-+]?\d+,\d+$/.test(s)) s = s.replace(",", ".");
  else if (/^[-+]?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  if (!/^[-+]?\d*\.?\d+(e[-+]?\d+)?$/i.test(s)) return NaN;
  return parseFloat(s);
}
/**
 * Divideix una resposta en llista de termes.
 * "1, 3"        → llista de 2 enters
 * "3/2, -3/2"   → llista de fraccions
 * "1,6; 8,2; 3,2" → llista de decimals (coma = decimal, ';' = separador)
 * "1,5"         → UN decimal, no una llista
 */
function aParts(s) {
  s = String(s).trim();
  if (!s) return [];
  /* ';' sempre separa termes de llista */
  if (s.indexOf(";") >= 0) {
    return s.split(";").map(function (x) { return x.trim(); }).filter(Boolean);
  }
  if (s.indexOf(",") < 0) return [s];
  var parts = s.split(",").map(function (x) { return x.trim(); });
  if (parts.length < 2) return [s];
  /* Tots els termes han de ser "nombres simples" (amb o sense fracció).
     Si en un terme hi ha un signe, un parèntesi o lletres, la coma era
     decimal i el text SÓN un únic número. */
  var totsNombres = parts.every(function (x) {
    return /^[-+]?\d+(\.\d+)?([eE][-+]?\d+)?$/.test(x) ||
           /^[-+]?\d+\/\d+$/.test(x) ||
           /^[-+]?\d+(\.\d+)?\/\d+$/.test(x);
  });
  return totsNombres ? parts : [s];
}
/**
 * correct pot ser number | string. Accepta 3/4, 1,5, dne, +inf, x=3, sí/no
 * i llistes ("1,5; 8/5; 16/5" o "1, 3" o "1,5, 8,2, 3,2").
 */
L1.check = function (correct, user) {
  var norm = function (s) {
    return String(s).toLowerCase().replace(/−/g, "-").replace(/∞/g, "inf").replace(/[º°]/g, "").trim();
  };
  var u = norm(user);
  if (!u) return false;
  var c = correct;

  /* respostes alternatives: qualsevol val */
  if (Array.isArray(c)) return c.some(function (z) { return L1.check(z, user); });

  /* --- cas d'una llista de valors a tots dos costats --- */
  var cParts = (typeof c === "string") ? aParts(c) : null;
  var uParts = aParts(u);
  if (cParts && cParts.length > 1 && uParts.length > 1) {
    return mateixaLlista(cParts, uParts);
  }

  if (typeof c === "number") {
    var v = aNum(u);
    return isFinite(v) && Math.abs(v - c) <= 1e-6 * Math.max(1, Math.abs(c));
  }

  var cn = norm(c).replace(/\s+/g, "");
  var un = u.replace(/\s+/g, "");
  if (cn === un) return true;

  if (/^(dne|noexiste)$/.test(cn) && /^(dne|noexiste|no|indefinido|nolimiteexiste|sinlimite)$/.test(un)) return true;
  if (cn === "+inf" && /^(inf|\+inf|infinito|\+infinito|infinity)$/.test(un)) return true;
  if (cn === "-inf" && /^(-inf|-infinito|-infinity)$/.test(un)) return true;
  if (cn === "si" && /^(si|s|yes|continua|continuo)$/.test(un)) return true;
  if (cn === "no" && /^(no|n|false|discontinua|discontinuo)$/.test(un)) return true;
  if (/^[a-z]+=/.test(cn) && /^[a-z]+=/.test(un)) {
    if (cn.replace(/^[a-z]+=/, "") === un.replace(/^[a-z]+=/, "")) return true;
  }

  /* comparació numèrica tolerante: cobreix "3/2" vs "1,5" vs "-1.5" */
  var t1 = aNum(cn), t2 = aNum(un);
  if (isFinite(t1) && isFinite(t2)) return Math.abs(t1 - t2) <= 1e-6 * Math.max(1, Math.abs(t1));

  return false;
};
/* dues llistes de valors són iguals si tenen el mateix nombre de termes,
   tots valen entre si (amb tolerància) i el multiconjunt coincideix */
function mateixaLlista(a, b) {
  if (a.length !== b.length) return false;
  var used = new Array(b.length).fill(false);
  for (var i = 0; i < a.length; i++) {
    var x = aNum(a[i]), hit = -1;
    for (var j = 0; j < b.length; j++) {
      if (used[j]) continue;
      var y = aNum(b[j]);
      var ok;
      if (isFinite(x) && isFinite(y)) ok = Math.abs(x - y) <= 1e-6 * Math.max(1, Math.abs(x));
      else ok = String(a[i]).toLowerCase() === String(b[j]).toLowerCase();
      if (ok) { hit = j; break; }
    }
    if (hit < 0) return false;
    used[hit] = true;
  }
  return true;
}

/* ---------------------------------------------------------------- */
/* 7. RNG determinista (reutilitza el motor)                         */
/* ---------------------------------------------------------------- */
function iint(r, a, b) { return r.int(a, b); }
function f2(n) { return Math.round(n * 1e6) / 1e6; }
function numV(v) { return A.num(v); }
function V(n) { return A.var(n); }
function ratioAST(num, den) { return A.div(num.toAST(), den.toAST()); }

/* ---------------------------------------------------------------- */
/* 8. Els 12 exercicis (tOT verificat numèricament)                   */
/* ---------------------------------------------------------------- */

/* --- 1 · Bolzano: existeix c amb f(c) = -1 ----------------------- */
EX.push({
  n: 1, tipus: "teorema", títol: "Bolzano: existeix c amb f(c) = −1",
  aprens: "Bolzano: si f és contínua a [a,b] i f(a), f(b) tenen signe diferent, hi ha c ∈ (a,b) amb f(c)=0. " +
    "Aquí busquem f(c) = −1, així que definim g(x) = f(x) + 1 i busquem els zeros de g. " +
    "Truc: primer troba un interval on f estigui clarament per damunt i per sota de −1.",
  make: function (r) {
    var k = iint(r, 1, 3);
    /* f(x) = x³ - k x² + x ; g = f + 1 */
    var f = function (x) { return x * x * x - k * x * x + x; };
    var g = function (x) { return f(x) + 1; };
    var bo = L1.bolzano(g, -2, 0);
    return {
      problema: "Sigui f(x) = x³ − " + k + "x² + x. Demostreu que hi ha un c ∈ (−2, 0) tal que f(c) = −1.",
      enunciat: limEn(xto(0, null), mkn("mrow", null, [pw(mi("x"), mn(3)), mo("−"), mn(k), pw(mi("x"), mn(2)), mo("+"), mi("x")])),
      respostes: bo.ok ? [f2(bo.raiz)] : [],
      revisio: [
        "Volem f(c) = −1 ⇔ g(c) = 0 amb g(x) = f(x) + 1 = x³ − " + k + "x² + x + 1 (polinomi → contínua a ℝ).",
        "g(−2) = " + g(-2).toFixed(4) + " i g(0) = " + g(0).toFixed(4) + (bo.ok ? " → signe diferent." : " → mateix signe, canvia l'interval."),
        "Bolzano: hi ha c ∈ (−2,0) amb g(c)=0, és a dir f(c) = −1. ∎",
        "Per bisecció, c ≈ " + (bo.ok ? bo.raiz.toFixed(8) : "—") + "."
      ],
      hint: "g(x) = f(x) + 1. Avalua g als extrems d'un interval on hi hagi canvi de signe."
    };
  }
});

/* --- 2 · Bolzano: sin x + 2x − 1 = 0 a [0, π/2] ------------------ */
EX.push({
  n: 2, tipus: "teorema", títol: "Bolzano: sin x + 2x − 1 = 0 a [0, π/2]",
  aprens: "Mateix teorema que l'exercici 1, però l'interval acaba en π/2 (irracional) i la funció no és polinòmica. " +
    "El que fa funcionar Bolzano és: (a) continuïtat a tot l'interval, (b) canvi de signe als extrems.",
  make: function (r) {
    var k = iint(r, 1, 3);   /* sin x + k x − 1 = 0 */

        "PASSEJ 1 — derivada: f'(x) = 6x − 2.",
        "PASSEJ 2 — condició. La tangent a f en t és y = f(t) + f'(t)(x − t). Volem que passi per (2, 6):",
        "  6 = f(t) + f'(t)·(2 − t) = 3t² − 2t + 1 + (6t − 2)(2 − t).",
        "PASSEJ 3 — resol. Desenvolupem (6t−2)(2−t) = 12t − 4 − 6t² + 2t = −6t² + 14t − 4.",
        "  6 = 3t² − 2t + 1 − 6t² + 14t − 4 = −3t² + 12t − 3.",
        "  −3t² + 12t − 9 = 0 ⇔ t² − 4t + 3 = 0 ⇔ (t − 1)(t − 3) = 0 → t = 1 i t = 3.",
        "PASSEJ 4 — els punts: f(1) = 3 − 2 + 1 = 2 → (1, 2) i f(3) = 27 − 6 + 1 = 22 → (3, 22).",
        "Comprovació de la tangent a (1,2): pendent f'(1) = 4 → y − 2 = 4(x − 1) → a x=2 dona y = 6 ✓."
      ],
      hint: "Iguala f(t) + f'(t)(2 − t) = 6 i resol la quadràtica."
    };
  }
});

/* ---------------------------------------------------------------- */
/* 9. Render i interacció                                            */
/* ---------------------------------------------------------------- */
var view = document.getElementById("l1view");
var prog = {};
try { prog = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { prog = {}; }
function saveProg() { try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch (e) {} }
function updateProgress() {
  var f = EX.filter(function (b) { return prog[b.n]; }).length;
  document.getElementById("l1prog").textContent = f + "/" + EX.length;
}

function showHome() {
  view.innerHTML = "";
  var head = el("div", "screen-head");
  head.appendChild(el("h1", "screen-title", "Llista 1 de Càlcul"));
  head.appendChild(el("p", "screen-sub",
    "12 exercicis, 32 apartats. Per a cada un: què aprens, un exemple resolt pas a pas i una variant " +
    "per practicar. Tot és a part: no toca el joc principal ni el seu progrés."));
  view.appendChild(head);
  var grid = el("div", "levels");
  EX.forEach(function (b) {
    var c = el("button", "level" + (prog[b.n] ? " passed" : ""));
    c.appendChild(el("div", "level-top", [
      el("span", "level-n", String(b.n)),
      el("span", "level-name", b.titol)
    ]));
    var meta = el("div", "level-meta");
    meta.appendChild(el("span", "chip chip-mute", prog[b.n] ? "✓ fet" : "per fer"));
    meta.appendChild(el("span", "chip chip-mute", b.tipus));
    c.appendChild(meta);
    c.addEventListener("click", function () { showEx(b.n); });
    grid.appendChild(c);
  });
  view.appendChild(grid);
  view.appendChild(el("div", "card", "Mides: escriu el resultat (6, −5/3, 3/2, dne, +inf, 1,5 …). " +
    "Si l'exercici té més d'una resposta separated per comes, escriu-les totes."));
  updateProgress();
}

function showEx(n) {
  view.innerHTML = "";
  var b = EX.filter(function (x) { return x.n === n; })[0];
  if (!b) { showHome(); return; }

  var c = card();
  c.appendChild(btn("btn btn-sm btn-ghost", "← Torna a la llista", showHome));
  var h = el("h2", "", "Exercici " + b.n + ": " + b.titol);
  h.style.fontSize = "1.05rem";
  c.appendChild(h);
  var box = el("div", "callout");
  box.appendChild(el("b", "", "Què aprens: "));
  box.appendChild(el("span", "", b.aprens));
  c.appendChild(box);
  view.appendChild(c);

  var pr = card();
  var row = el("div", "row row-wrap");
  var seed = document.createElement("input");
  seed.className = "field mono"; seed.style.maxWidth = "110px";
  seed.value = String(Math.floor(Math.random() * 100000));
  seed.title = "Llavor: mateixa llavor = mateix problema";
  row.appendChild(el("span", "small", "Variant (llavor):"));
  row.appendChild(seed);
  row.appendChild(btn("btn btn-sm", "Torna a tirar", function () {
    seed.value = String(Math.floor(Math.random() * 100000));
    renderVariant();
  }));
  pr.appendChild(row);
  var out = el("div"); out.style.marginTop = "10px";
  pr.appendChild(out);
  view.appendChild(pr);

  function renderVariant() {
    out.innerHTML = "";
    var data;
    try { data = b.make(L.rng(Number(seed.value) | 0)); }
    catch (e) { out.appendChild(el("div", "notice notice-warn", "Error generant la variant: " + e.message)); return; }

    var q = el("div");
    if (data.aparat) q.appendChild(el("span", "chip chip-accent", "Apartat " + data.aparat));
    q.appendChild(el("div", "", data.problema));
    if (data.enunciat) q.appendChild(mathBox(data.enunciat));
    out.appendChild(q);

    var inp = document.createElement("input");
    inp.className = "field"; inp.style.minWidth = "220px";
    inp.placeholder = "Resposta (6, −5/3, dne, +inf, 21/10, 1,2 …)";
    var fb = el("div", "small"); fb.style.marginTop = "6px";
    var row2 = el("div", "row row-wrap");
    row2.appendChild(inp);
    row2.appendChild(btn("btn btn-sm btn-primary", "Comprovar", function () {
      var ok = L1.check(data.respostes, inp.value);
      if (ok) { prog[b.n] = true; saveProg(); updateProgress(); fb.style.color = "var(--ok)"; fb.textContent = "✓ Correcte!"; }
      else { fb.style.color = "var(--err)"; fb.textContent = "✕ No és. Pista: " + (data.hint || "llegeix la solució"); }
    }));
    row2.appendChild(btn("btn btn-sm btn-ghost", "Pista", function () {
      fb.style.color = "var(--warn)"; fb.textContent = "💡 " + (data.hint || "");
    }));
    row2.appendChild(btn("btn btn-sm btn-ghost", "Solució pas a pas", function () {
      var rev = el("div", "explain");
      rev.appendChild(el("b", "", "Solució: "));
      rev.appendChild(el("span", "", (data.revisio || []).join("  ")));
      if (data.extra) rev.appendChild(el("div", "small muted", data.extra));
      out.appendChild(rev);
    }));
    row2.appendChild(btn("btn btn-sm btn-ghost", "Resposta", function () {
      fb.style.color = "var(--accent)";
      fb.textContent = "Resposta: " + data.respostes.map(function (z) {
        /* si és un double "net" que prové d'un racional, mostra'l com a fracció */
        if (typeof z === "number" && isFinite(z)) {
          for (var den = 1; den <= 40; den++) {
            var num = z * den;
            if (Math.abs(num - Math.round(num)) < 1e-9 && Math.round(num) !== 0) {
              return den === 1 ? String(Math.round(num))
                : String(Math.round(num)) + "/" + String(den);
            }
          }
          return String(z);
        }
        return String(z);
      }).join(",  ");
    }));
    out.appendChild(row2);
    out.appendChild(fb);

    /* si l'exercici és de trossos, verifiquem la continuïtat de debò */
    if (data.trossosReals && typeof data.at === "number") {
      var cont = L1.continuidad(data.trossosReals, data.at);
      var nb = el("div", "notice notice-accent"); nb.style.marginTop = "10px";
      nb.appendChild(el("span", {}, "Verificació automàtica: " + cont.tipo));
      out.appendChild(nb);
    }
    /* si l'exercici proposa un cas concret extra (com l'ex. 10), el mostrem */
    if (data.exSample) {
      var sb2 = el("div", "notice notice-accent");
      sb2.style.marginTop = "10px";
      sb2.appendChild(el("b", {}, "Cas concret: "));
      sb2.appendChild(el("span", {}, data.exSample.problema));
      out.appendChild(sb2);
    }

    /* si hi ha generador del motor equivalent, enFem una variant */
    var genMap = GEN_EQUIV[b.n];
    if (genMap && L && L.generatorList && L.generatorList().indexOf(genMap) >= 0) {
      var gb = btn("btn btn-sm btn-ghost", "Variant del motor oficial (" + genMap + ")", function () {
        try {
          var q2 = L.generate({ seed: Math.floor(Math.random() * 100000), generatorIds: [genMap] });
          var box2 = el("div", "explain");
          box2.appendChild(el("b", "", "Variant del motor (" + q2.generatorId + "): "));
          box2.appendChild(A.toMathML(q2.statement.expr));
          box2.appendChild(el("span", "", "  → " + L.targetLabel(q2.statement.target) +
            " = " + L.answerToString(q2.answer) + ".  " + L1.ev(q2.statement.expr, 0) + " "));
          box2.appendChild(el("div", "small muted", q2.quiz ? q2.quiz.question : ""));
          out.appendChild(box2);
        } catch (err) { out.appendChild(el("div", "notice notice-warn", "El motor no ha pogut generar: " + err.message)); }
      });
      out.appendChild(gb);
    }
  }
  renderVariant();
}

/* generadors del motor equivalents per exercici (si n'hi ha) */
var GEN_EQUIV = {
  4: "lateral-signo", 5: "trozos-continua", 6: "trozos-parametro", 7: "trozos-parametro",
  9: "cero-cero-notables", 10: "lateral-signo"
};

/* ---------------------------------------------------------------- */
/* 10. Arranque                                                       */
/* ---------------------------------------------------------------- */
document.getElementById("l1home").addEventListener("click", showHome);
if (window.Lim) {
  L = window.Lim; Q = L.Q; Poly = L.Poly; A = L.ast;
  showHome();
} else {
  view.appendChild(el("div", "notice notice-warn",
    "No s'ha pogut carregar src/engine.js. Obre aquest fitxer des de la carpeta del projecte."));
}

})();
</script>
